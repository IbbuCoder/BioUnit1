LESSONS.biomol = [
 {kind:'simple', title:'Why "macro"molecules?', html:`
  <p>Macro means large. <em>Macromolecules</em> (also called biomolecules) are the four big families of molecules that build every living thing: <strong>carbohydrates, lipids, proteins, and nucleic acids</strong>.</p>
  <p>Three of the four are <em>polymers</em>: long chains built from repeating small units called <em>monomers</em>. Think of monomers as LEGO bricks and polymers as what you build with them.</p>
  <div class="callout">All four are built on a backbone of <strong>carbon</strong>, which is why they're called organic molecules.</div>`},

 {kind:'deep', title:'The four families', html:`
  <div class="vocab-item"><b>Carbohydrates</b><span>Elements C, H, O (roughly 1:2:1). Monomer = monosaccharide (glucose). Job: <em>quick energy</em>, plus structure in plants (cellulose). Examples: sugar, bread, pasta, starch.</span></div>
  <div class="vocab-item"><b>Lipids</b><span>Elements C, H, O — but far less oxygen, and <em>not</em> true polymers. Built from glycerol + fatty acids. Job: <em>long-term energy storage</em>, insulation, and building the cell membrane (phospholipids). Examples: fats, oils, waxes, cholesterol.</span></div>
  <div class="vocab-item"><b>Proteins</b><span>Elements C, H, O, <em>N</em> (nitrogen). Monomer = amino acid (20 kinds). Job: enzymes, structure, transport, muscle, membrane channels and pumps. Examples: meat, eggs, beans, hemoglobin.</span></div>
  <div class="vocab-item"><b>Nucleic acids</b><span>Elements C, H, O, N, <em>P</em> (phosphorus). Monomer = nucleotide. Job: store and carry <em>genetic information</em>. Examples: DNA, RNA.</span></div>
  <div class="callout"><strong>Fast ID trick:</strong> nitrogen but no phosphorus → protein. Nitrogen <em>and</em> phosphorus → nucleic acid. Only C, H, O in a 1:2:1-ish ratio → carbohydrate. Mostly C and H, greasy → lipid.</div>`},

 {kind:'vocab', title:'Vocabulary to lock in', html:
  V('Macromolecule','A large organic molecule built by living things; the four types are carbohydrates, lipids, proteins, and nucleic acids.') +
  V('Monomer','The single repeating unit that makes up a polymer.') +
  V('Polymer','A long chain of monomers bonded together.') +
  V('Carbohydrate','Sugar or starch used mainly for quick energy; monomer is a monosaccharide such as glucose.') +
  V('Lipid','Fat, oil, wax, or phospholipid; used for long-term energy storage, insulation, and membranes.') +
  V('Protein','Polymer of amino acids; does most of the cell\u2019s work, including enzymes and membrane transport proteins.') +
  V('Nucleic acid','DNA or RNA; polymer of nucleotides that stores genetic information.')},

 {kind:'example', title:'Real-world example', html:`
  <p>Read the nutrition label on a granola bar: 22 g carbohydrate, 7 g fat, 4 g protein.</p>
  <p>The carbohydrate hits your bloodstream fastest — that's the <em>quick energy</em> sugar. The 7 g of fat has more than twice the energy per gram and gets stored if you don't use it — <em>long-term storage</em>. The 4 g of protein is mostly broken into amino acids and reused to build your own proteins, not burned first.</p>
  <p>Notice what the label never lists: nucleic acids. You do eat them (all cells contain DNA), but they aren't a nutrient your body counts for energy.</p>`},

 {kind:'think', title:'Think about it', html:`
  <p>A molecule is analyzed and contains carbon, hydrogen, oxygen, nitrogen, and phosphorus.</p>
  <p><strong>Which macromolecule is it, and which element gave it away?</strong></p>
  <div class="callout think">Only one family routinely includes phosphorus in every monomer.</div>`},

 {kind:'mistake', title:'Common mistake', html:`
  <div class="callout warn"><p><strong>Mistake:</strong> "Lipids are polymers made of lipid monomers."</p>
  <p>Lipids are the exception. They're assembled from glycerol and fatty acids, but they are not long repeating chains, so they aren't true polymers.</p></div>
  <div class="callout warn"><p><strong>Mistake:</strong> "Protein is for energy."</p>
  <p>Your body <em>can</em> burn protein, but that's a last resort. Proteins are mainly for building and doing work — enzymes, transport proteins, muscle fibers.</p></div>`},

 {kind:'check', q:{id:'chk_biomol_1', topic:'biomol', diff:'medium', type:'application',
  stem:'A lab test shows an unknown molecule contains carbon, hydrogen, oxygen, and nitrogen, and is built from a chain of 148 repeating units. It contains no phosphorus. What is it?',
  choices:['A protein','A carbohydrate','A lipid','A nucleic acid'],
  answer:0, hint:'Which element narrows it to two families, and which element rules one of them out?',
  explain:'Nitrogen points to protein or nucleic acid. No phosphorus rules out nucleic acid, so it is a protein made of amino acid monomers.',
  why:{1:'Carbohydrates contain only C, H, and O — the nitrogen rules this out.',2:'Lipids contain only C, H, and O and are not built as long repeating chains.',3:'Nucleic acid nucleotides always contain a phosphate group, and no phosphorus was found.'}}}
];

LESSONS.membrane = [
 {kind:'simple', title:'The cell\u2019s border control', html:`
  <p>Every cell is wrapped in a <em>cell membrane</em> (plasma membrane). Its job is not just to hold the cell together — it decides what gets in and out.</p>
  <p>It's built from a double layer of phospholipids, which is why it's called the <strong>phospholipid bilayer</strong>.</p>`},

 {kind:'deep', title:'Why the bilayer forms', html:`
  <p>One phospholipid has two very different ends:</p>
  <div class="vocab-item"><b>Head</b><span>Contains a phosphate group. It is <em>hydrophilic</em> — "water-loving." It faces the watery fluid.</span></div>
  <div class="vocab-item"><b>Two tails</b><span>Fatty acid chains. They are <em>hydrophobic</em> — "water-fearing." They hide from water.</span></div>
  <p>Both the inside of the cell and the outside are watery. So the heads point outward on both sides and the tails tuck into the middle, away from water. That's the bilayer — and it forms automatically, without the cell "doing" anything.</p>`, fig:figMembrane},

 {kind:'deep', title:'Proteins are part of the membrane too', html:`
  <p>The membrane isn't a solid wall; the phospholipids drift around like people in a crowd. That's why it's described by the <strong>fluid mosaic model</strong>: <em>fluid</em> because the parts move, <em>mosaic</em> because it's a mixture of many pieces.</p>
  <div class="vocab-item"><b>Channel proteins</b><span>Tunnels that let specific particles slide through — used in facilitated diffusion. No energy needed.</span></div>
  <div class="vocab-item"><b>Carrier proteins</b><span>Bind a particle and change shape to move it across. Used in facilitated diffusion <em>and</em> in active transport pumps.</span></div>
  <div class="vocab-item"><b>Receptor proteins</b><span>Receive chemical signals from outside the cell.</span></div>
  <p>Cholesterol sits between the tails and keeps the membrane from becoming too stiff or too loose.</p>`},

 {kind:'vocab', title:'Vocabulary to lock in', html:
  V('Cell membrane','The selectively permeable boundary of the cell, made of a phospholipid bilayer with embedded proteins.') +
  V('Phospholipid','A lipid with a hydrophilic phosphate head and two hydrophobic fatty acid tails.') +
  V('Hydrophilic / hydrophobic','Attracted to water / repelled by water.') +
  V('Membrane protein','A protein embedded in the membrane that acts as a channel, carrier, pump, or receptor.') +
  V('Fluid mosaic model','The description of the membrane as a moving mixture of lipids, proteins, and cholesterol.')},

 {kind:'example', title:'Real-world example', html:`
  <p>Pour oil into a glass of water and shake it. Tiny oil droplets form spheres, then the oil separates back out. Nobody arranged it — the hydrophobic molecules simply cluster away from water because that arrangement is stable.</p>
  <p>A phospholipid bilayer forms for exactly the same reason. That's also why a small tear in a membrane can reseal itself.</p>`},

 {kind:'think', title:'Think about it', html:`
  <p>Oxygen (O₂) is small and nonpolar. Sodium ions (Na⁺) are much smaller than oxygen molecules in mass — but charged.</p>
  <p><strong>Which one crosses the bilayer more easily, and why?</strong></p>
  <div class="callout think">Think about what the middle of the membrane is made of, and what it repels.</div>`},

 {kind:'mistake', title:'Common mistake', html:`
  <div class="callout warn"><p><strong>Mistake:</strong> "Smaller particles always cross faster."</p>
  <p>Size matters, but <em>charge and polarity</em> matter just as much. A tiny charged ion is blocked by the hydrophobic tails, while a slightly larger nonpolar molecule slips right through.</p></div>
  <div class="callout warn"><p><strong>Mistake:</strong> "The tails face outward toward the water."</p>
  <p>Backwards. Heads face the water on both sides; tails hide in the middle.</p></div>`},

 {kind:'check', q:{id:'chk_membrane_1', topic:'membrane', diff:'medium', type:'which',
  stem:'Why do phospholipids automatically arrange themselves into a bilayer in the body?',
  choices:['The hydrophobic tails are repelled by water on both sides, so they face inward','The heads are heavier, so they sink to the outside','Proteins physically stack the phospholipids into two rows','ATP is used to hold the two layers together'],
  answer:0, hint:'Both the cytoplasm and the fluid outside the cell are mostly water.',
  explain:'Water is on both sides of the membrane. The hydrophilic heads face that water, and the hydrophobic tails are pushed together in the middle. The structure is self-assembling and needs no energy input.',
  why:{1:'Arrangement is caused by water attraction and repulsion, not by weight or gravity.',2:'Proteins are embedded in the bilayer; they do not build it.',3:'No ATP is needed — the bilayer forms spontaneously.'}}}
];

LESSONS.permeable = [
 {kind:'simple', title:'Selective, not sealed', html:`
  <p><em>Selectively permeable</em> (also called semipermeable) means the membrane lets <strong>some</strong> substances cross while blocking others.</p>
  <p>If nothing could cross, the cell would starve. If everything could cross, the cell couldn't control its own contents. Selective permeability is the compromise that makes homeostasis possible.</p>`},

 {kind:'deep', title:'What decides whether something gets through?', html:`
  <div class="vocab-item"><b>Size</b><span>Small molecules pass more easily than large ones. Glucose and proteins are too large to slip through the bilayer on their own.</span></div>
  <div class="vocab-item"><b>Charge</b><span>Ions (Na⁺, K⁺, Cl⁻) are repelled by the hydrophobic core and need a channel or pump.</span></div>
  <div class="vocab-item"><b>Polarity</b><span>Nonpolar molecules (O₂, CO₂, small lipids) dissolve through the tails easily. Polar molecules struggle.</span></div>
  <p><strong>Crosses the bilayer directly:</strong> O₂, CO₂, small nonpolar molecules — and water, slowly, because it is so small (water also gets its own channels called aquaporins).</p>
  <p><strong>Needs a protein:</strong> glucose, amino acids, and all ions.</p>
  <p><strong>Blocked:</strong> very large molecules like starch and most proteins — these require bulk transport.</p>`},

 {kind:'vocab', title:'Vocabulary to lock in', html:
  V('Selectively permeable','Allows certain substances to cross while restricting others.') +
  V('Solute','The substance dissolved in a solvent — for example, salt or sugar in water.') +
  V('Solvent','The substance doing the dissolving — in cells, water.') +
  V('Concentration','How much solute is present in a given volume of solution.') +
  V('Aquaporin','A membrane protein channel that lets water cross the membrane quickly.')},

 {kind:'example', title:'Real-world example', html:`
  <p>A coffee filter is permeable: liquid passes, grounds don't — but it can't choose between two liquids. A dialysis machine goes further: its membrane keeps blood cells and proteins in the blood while letting small waste molecules like urea pass out.</p>
  <p>That's the same principle a cell membrane uses, and it's why the egg lab works — the egg membrane lets water through but holds the large proteins inside.</p>`},

 {kind:'think', title:'Think about it', html:`
  <p>Starch is a long chain of glucose monomers. Glucose alone is much smaller.</p>
  <p><strong>If a selectively permeable bag holds starch and sits in water with iodine (a small molecule), which substance moves, and which way?</strong></p>
  <div class="callout think">Only the small molecule can cross — so the color change happens where the starch already is.</div>`},

 {kind:'mistake', title:'Common mistake', html:`
  <div class="callout warn"><p><strong>Mistake:</strong> "Selectively permeable means the cell chooses, like a decision."</p>
  <p>The membrane has no brain. "Selective" comes from its physical structure: size, charge, polarity, and which proteins happen to be present.</p></div>
  <div class="callout warn"><p><strong>Mistake:</strong> Mixing up solute and solvent. In biology the solvent is almost always water; the solute is what's dissolved in it.</p></div>`},

 {kind:'check', q:{id:'chk_perm_1', topic:'permeable', diff:'hard', type:'application',
  stem:'A membrane allows water and iodine through but not starch. A bag of starch solution is placed in a beaker of water and iodine. What happens?',
  choices:['Iodine moves into the bag and the starch solution changes color','Starch moves out and the beaker changes color','Nothing moves because the membrane blocks everything','Only the starch moves, because it is at a higher concentration'],
  answer:0, hint:'Each substance diffuses down its own gradient — if it is able to cross at all.',
  explain:'Iodine is small enough to cross and is more concentrated outside, so it diffuses into the bag and reacts with the starch there. Starch is too large to leave the bag.',
  why:{1:'Starch cannot cross a membrane that blocks it, no matter what the gradient is.',2:'Water and iodine can both cross, so movement definitely occurs.',3:'Being concentrated does not help if the molecule physically cannot fit through.'}}}
];

LESSONS.diffusion = [
 {kind:'simple', title:'Spreading out on its own', html:`
  <p><em>Diffusion</em> is the movement of particles from an area of <strong>high concentration</strong> to an area of <strong>low concentration</strong>.</p>
  <p>The particles are not being pushed by the cell. They're already moving randomly because they have kinetic energy. When one side is crowded, random motion just happens to move more particles away from the crowd than back into it.</p>
  <div class="callout">Diffusion is <em>passive</em>: it requires no ATP. It moves particles <em>down</em> the concentration gradient.</div>`},

 {kind:'deep', title:'Watch it happen', html:`
  <p>Remove the barrier below. Nothing pushes the particles right — they keep bouncing randomly — yet the counter still evens out.</p>
  <p>When both sides are roughly equal, the system is at <em>dynamic equilibrium</em>: particles still move, but there is no <strong>net</strong> movement in either direction.</p>`, fig:figDiffusion},

 {kind:'deep', title:'What speeds diffusion up?', html:`
  <div class="vocab-item"><b>Steeper gradient</b><span>A bigger difference between the two sides = faster net movement.</span></div>
  <div class="vocab-item"><b>Higher temperature</b><span>More kinetic energy = particles move faster.</span></div>
  <div class="vocab-item"><b>Smaller particles</b><span>Move faster and pass through more easily.</span></div>
  <div class="vocab-item"><b>More surface area</b><span>More membrane area = more places to cross at once.</span></div>
  <div class="vocab-item"><b>Shorter distance</b><span>Thin membranes let diffusion finish faster — one reason cells stay small.</span></div>`},

 {kind:'vocab', title:'Vocabulary to lock in', html:
  V('Diffusion','Net movement of particles from high to low concentration; passive, no energy required.') +
  V('Concentration gradient','The difference in concentration between two areas.') +
  V('Down the gradient','Moving from high concentration toward low concentration.') +
  V('Equilibrium','Concentrations are even; particles still move, but there is no net change.') +
  V('Passive transport','Any movement across a membrane that requires no cellular energy.')},

 {kind:'example', title:'Real-world example', html:`
  <p>Someone opens a bag of popcorn across the room. A minute later you smell it, even though no one fanned the air toward you.</p>
  <p>Scent molecules were extremely concentrated at the bag and absent near you. Random motion carried more of them outward than back. Once the whole room smells the same, diffusion hasn't stopped — it has reached equilibrium.</p>
  <p>In your body, the same process moves O₂ from your lungs into your blood, and CO₂ the other way.</p>`},

 {kind:'think', title:'Think about it', html:`
  <p>Your cells constantly use up oxygen during cellular respiration.</p>
  <p><strong>How does using oxygen actually help more oxygen diffuse in?</strong></p>
  <div class="callout think">Think about what happens to the gradient when the inside concentration keeps dropping.</div>`},

 {kind:'mistake', title:'Common mistake', html:`
  <div class="callout warn"><p><strong>Mistake:</strong> "At equilibrium, the particles stop moving."</p>
  <p>They never stop. Equilibrium means equal movement in both directions — <em>no net change</em>, not "no motion."</p></div>
  <div class="callout warn"><p><strong>Mistake:</strong> "Diffusion happens because the cell wants nutrients."</p>
  <p>Diffusion has no goal and no direction of its own. It's random motion plus a gradient.</p></div>`},

 {kind:'check', q:{id:'chk_diff_1', topic:'diffusion', diff:'medium', type:'scenario',
  stem:'Perfume is sprayed in one corner of a sealed room. Two hours later the scent is even throughout. Which statement is correct?',
  choices:['The molecules are still moving, but there is no net movement in any direction','The molecules have stopped moving completely','The molecules are now being actively pushed by the air','Diffusion reversed and the molecules returned to the corner'],
  answer:0, hint:'What does the word "net" add to the phrase "net movement"?',
  explain:'This is dynamic equilibrium. Molecules keep moving randomly, but equal numbers move each way, so the concentration stays even.',
  why:{1:'Particles never stop moving; they have kinetic energy above absolute zero.',2:'Diffusion needs no pushing — it is driven by random motion and a gradient.',3:'Particles do not move back up a gradient on their own; that would require energy.'}}}
];

LESSONS.facdiff = [
 {kind:'simple', title:'Diffusion with a door', html:`
  <p>Some particles need to get in, but can't cross the phospholipid bilayer — they're too big, too polar, or charged.</p>
  <p><em>Facilitated diffusion</em> is diffusion through a membrane protein. "Facilitated" means <strong>helped</strong>. The protein is a door, not a motor: it still requires <strong>no ATP</strong>, and particles still move <strong>high → low</strong>.</p>`},

 {kind:'deep', title:'Channels vs. carriers', html:`
  <div class="vocab-item"><b>Channel protein</b><span>An open tunnel that specific particles slide through. Aquaporins (for water) and ion channels work this way.</span></div>
  <div class="vocab-item"><b>Carrier protein</b><span>Binds the particle, changes shape, and releases it on the other side. Glucose enters most cells this way.</span></div>
  <p>Both are <em>specific</em>: a glucose carrier will not transport amino acids. That specificity is where the "selective" in selectively permeable comes from.</p>
  <p>Because there is a limited number of proteins, facilitated diffusion can be <em>saturated</em> — once every protein is busy, adding more solute doesn't speed it up. Simple diffusion has no such limit.</p>`, fig:figMembrane},

 {kind:'vocab', title:'Vocabulary to lock in', html:
  V('Facilitated diffusion','Passive movement of particles down their gradient with the help of a membrane protein.') +
  V('Channel protein','A protein tunnel that lets specific particles pass through the membrane.') +
  V('Carrier protein','A protein that binds a particle and changes shape to move it across.') +
  V('Specificity','A transport protein only moves the particle it is shaped for.')},

 {kind:'example', title:'Real-world example', html:`
  <p>After you eat, blood glucose rises. Glucose is polar and fairly large, so it can't dissolve through the fatty core of the membrane.</p>
  <p>Instead, GLUT carrier proteins in your cell membranes bind glucose and flip it inward — down its concentration gradient, with no ATP spent. Your muscle cells then burn that glucose, keeping the inside concentration low and the gradient steep.</p>`},

 {kind:'think', title:'Think about it', html:`
  <p>A student says: "Facilitated diffusion uses a protein, and proteins are made using energy, so facilitated diffusion is active transport."</p>
  <p><strong>Why is that reasoning wrong?</strong></p>
  <div class="callout think">The question isn't whether the cell ever spent energy — it's whether energy is spent during <em>the transport event itself</em>.</div>`},

 {kind:'mistake', title:'Common mistake', html:`
  <div class="callout warn"><p><strong>Mistake:</strong> "If a protein is involved, it must be active transport."</p>
  <p>Protein ≠ active. The real test is direction: <em>down</em> the gradient = passive; <em>against</em> the gradient = active.</p></div>
  <div class="callout warn"><p><strong>Mistake:</strong> "Facilitated diffusion is faster in every situation."</p>
  <p>It's faster for particles that can't cross alone, but it saturates once every protein is occupied.</p></div>`},

 {kind:'check', q:{id:'chk_fac_1', topic:'facdiff', diff:'hard', type:'which',
  stem:'Glucose moves into a cell through a carrier protein, from higher concentration outside to lower concentration inside. How is this classified?',
  choices:['Facilitated diffusion, a type of passive transport','Active transport, because a protein is used','Simple diffusion through the bilayer','Osmosis, because it happens in a watery solution'],
  answer:0, hint:'Check the direction relative to the gradient first, then the protein.',
  explain:'The particle moves down its concentration gradient using a membrane protein and no ATP. That is facilitated diffusion, which is passive transport.',
  why:{1:'Using a protein does not make transport active. Active transport must move a substance against its gradient using ATP.',2:'Glucose is too large and too polar to cross the bilayer directly — the protein is required.',3:'Osmosis refers specifically to the movement of water, not glucose.'}}}
];

/* ============================================================================
   PART 3B — LESSONS (topics 7–12)
   ============================================================================ */
LESSONS.osmosis = [
 {kind:'simple', title:'Osmosis is diffusion — of water', html:`
  <p><em>Osmosis</em> is the diffusion of <strong>water</strong> across a selectively permeable membrane.</p>
  <p>Water moves from where there is <strong>more free water</strong> (fewer solutes) to where there is <strong>less free water</strong> (more solutes). Same rule as diffusion — just applied to the water instead of the solute.</p>
  <div class="callout">Shortcut you can trust: <strong>water follows solute.</strong> Water moves toward the saltier, sugarier side.</div>`},

 {kind:'deep', title:'Why water moves toward solute', html:`
  <p>When solutes dissolve, water molecules cluster around them and become less free to move. So a concentrated salt solution has a <em>lower</em> concentration of free water than pure water does.</p>
  <p>Water then diffuses down <em>its own</em> gradient: from high free-water concentration to low. The solute usually can't cross the membrane, so only water moves — and the volumes change.</p>
  <p>Osmosis is <strong>passive</strong>. No ATP.</p>`, fig:figOsmosis},

 {kind:'vocab', title:'Vocabulary to lock in', html:
  V('Osmosis','Diffusion of water across a selectively permeable membrane, from higher free-water (lower solute) to lower free-water (higher solute).') +
  V('Solute','The dissolved particles — salt, sugar — that water moves toward.') +
  V('Osmotic pressure','The pressure created as water moves into an area of higher solute concentration.') +
  V('Turgor pressure','In plant cells, the pressure of water pushing the membrane against the cell wall; it keeps plants upright.') +
  V('Lyse / crenate','An animal cell bursting from too much water in / shriveling from water loss.')},

 {kind:'example', title:'Real-world example', html:`
  <p>Salt a bowl of cucumber slices and wait ten minutes. A puddle of liquid appears at the bottom.</p>
  <p>The salt made the outside of the cucumber cells extremely concentrated. Water inside the cells diffused out through their membranes, and the cells lost pressure — that's why the slices go limp. The water was never "pulled out by the salt" like a magnet; it diffused down its own gradient.</p>
  <p>The reverse also works: wilted celery in plain water becomes crisp again as water moves into the cells and restores turgor pressure.</p>`},

 {kind:'think', title:'Think about it', html:`
  <p>A person stranded at sea is warned never to drink seawater, even though they're dehydrated.</p>
  <p><strong>Use osmosis to explain why drinking seawater makes dehydration worse.</strong></p>
  <div class="callout think">Compare the solute concentration of seawater to the solute concentration inside your cells.</div>`},

 {kind:'mistake', title:'Common mistake', html:`
  <div class="callout warn"><p><strong>Mistake:</strong> "Osmosis is when solute moves toward the water."</p>
  <p>Reverse it. In osmosis the <em>solute stays put</em> (it usually can't cross) and the <em>water moves</em>.</p></div>
  <div class="callout warn"><p><strong>Mistake:</strong> "Osmosis needs energy because volume changes."</p>
  <p>No ATP is involved. Osmosis is passive transport, exactly like diffusion.</p></div>`},

 {kind:'check', q:{id:'chk_osm_1', topic:'osmosis', diff:'medium', type:'scenario',
  stem:'A cell containing 3% solute is placed in a solution containing 12% solute. What happens?',
  choices:['Water moves out of the cell and it shrinks','Water moves into the cell and it swells','Solute moves into the cell until both sides are 7.5%','Nothing happens because the membrane blocks water'],
  answer:0, hint:'Water follows solute. Which side has more solute?',
  explain:'The outside solution has more solute (12% vs 3%), so it has less free water. Water diffuses out of the cell, and the cell shrinks.',
  why:{1:'Water moves toward the higher solute concentration, which is outside, not inside.',2:'The solute usually cannot cross a selectively permeable membrane — only water moves.',3:'The membrane is selectively permeable and water crosses it freely.'}}}
];

LESSONS.tonicity = [
 {kind:'simple', title:'Three words, one comparison', html:`
  <p>These three words describe the <strong>solution outside</strong> compared to the inside of the cell:</p>
  <div class="vocab-item"><b>Hypotonic</b><span><em>Less</em> solute outside than inside → water moves IN → cell swells. ("Hypo" = under, like a hypodermic needle going under the skin.)</span></div>
  <div class="vocab-item"><b>Hypertonic</b><span><em>More</em> solute outside than inside → water moves OUT → cell shrinks. ("Hyper" = over.)</span></div>
  <div class="vocab-item"><b>Isotonic</b><span><em>Equal</em> solute → no net movement → cell stays the same. ("Iso" = same.)</span></div>
  <div class="callout">The prefix always describes the <strong>solution</strong>, not the cell. "A cell in a hypertonic solution" means the solution is the concentrated one.</div>`},

 {kind:'deep', title:'See all three', html:`
  <p>Switch between the three solutions. Watch the arrows and the cell size, and read the note under the diagram.</p>`, fig:figTonicity},

 {kind:'deep', title:'Animal cells vs. plant cells', html:`
  <div class="vocab-item"><b>Animal cell, hypotonic</b><span>Swells and may burst — <em>lysis</em>. No wall to stop it.</span></div>
  <div class="vocab-item"><b>Plant cell, hypotonic</b><span>Swells until the cell wall pushes back — <em>turgid</em>. This is the healthy state for a plant.</span></div>
  <div class="vocab-item"><b>Animal cell, hypertonic</b><span>Shrivels — <em>crenation</em>.</span></div>
  <div class="vocab-item"><b>Plant cell, hypertonic</b><span>The membrane pulls away from the wall — <em>plasmolysis</em>. The plant wilts.</span></div>`},

 {kind:'vocab', title:'Vocabulary to lock in', html:
  V('Hypotonic','Solution with a lower solute concentration than the cell; water enters the cell.') +
  V('Hypertonic','Solution with a higher solute concentration than the cell; water leaves the cell.') +
  V('Isotonic','Solution with an equal solute concentration; no net water movement.') +
  V('Lysis','Bursting of an animal cell that takes in too much water.') +
  V('Plasmolysis','A plant cell\u2019s membrane pulling away from the cell wall after water loss.')},

 {kind:'example', title:'Real-world example', html:`
  <p>IV bags in hospitals are filled with 0.9% saline, not pure water. That concentration is <em>isotonic</em> to human blood cells.</p>
  <p>Pure water would be hypotonic — red blood cells would take in water and lyse. A very salty solution would be hypertonic — the cells would crenate. Isotonic means the cells keep their normal shape and function.</p>
  <p>The same logic explains salting food to preserve it: a hypertonic environment pulls water out of bacterial cells so they can't grow.</p>`},

 {kind:'think', title:'Think about it', html:`
  <p>A freshwater fish lives in water that is hypotonic to its body fluids.</p>
  <p><strong>Which direction does water constantly move, and what problem does the fish have to solve all day long?</strong></p>
  <div class="callout think">If water keeps coming in, something has to keep going out — and that costs the fish energy.</div>`},

 {kind:'mistake', title:'Common mistake', html:`
  <div class="callout warn"><p><strong>Mistake:</strong> "Hypertonic means the cell has more solute."</p>
  <p>The prefix describes the solution outside. Hypertonic solution = concentrated outside = water leaves the cell.</p></div>
  <div class="callout warn"><p><strong>Mistake:</strong> "In an isotonic solution, water stops moving."</p>
  <p>Water still crosses in both directions — the amounts are equal, so there's no <em>net</em> change.</p></div>`},

 {kind:'check', q:{id:'chk_ton_1', topic:'tonicity', diff:'hard', type:'application',
  stem:'A red blood cell is placed in distilled (pure) water. What happens and why?',
  choices:['It swells and may burst, because the solution is hypotonic to the cell','It shrivels, because pure water is hypertonic','Nothing, because pure water is isotonic to blood','It shrinks at first and then returns to normal size'],
  answer:0, hint:'Pure water has no solute at all. Compare that to the inside of the cell.',
  explain:'Pure water contains no solute, so it is hypotonic compared to the cytoplasm. Water moves into the cell, and because animal cells have no cell wall, the cell can lyse.',
  why:{1:'Hypertonic means more solute outside — pure water has the least solute possible.',2:'Isotonic requires equal solute concentrations; pure water has none.',3:'There is no mechanism that would reverse the water movement here.'}}}
];

LESSONS.active = [
 {kind:'simple', title:'Moving uphill', html:`
  <p><em>Active transport</em> moves particles <strong>against</strong> the concentration gradient — from low concentration to high — using a protein pump and <strong>ATP</strong>.</p>
  <p>Passive transport is a ball rolling downhill. Active transport is carrying the ball back up. It doesn't happen on its own, so the cell pays for it.</p>`},

 {kind:'deep', title:'Try the pump', html:`
  <p>Below, the outside is already crowded. A particle will not move out on its own — that's the wrong direction for diffusion. Spend ATP and watch what the pump can do.</p>`, fig:figActive},

 {kind:'deep', title:'Why cells bother', html:`
  <p>Concentration gradients are useful, and cells build them on purpose.</p>
  <div class="vocab-item"><b>Sodium-potassium pump</b><span>Pumps 3 Na⁺ out and 2 K⁺ in per ATP, both against their gradients. This gradient is what lets your nerve cells fire.</span></div>
  <div class="vocab-item"><b>Root hair cells</b><span>Pump minerals from dilute soil into cells that already contain more of them.</span></div>
  <div class="vocab-item"><b>Bulk transport</b><span>For particles far too large for any protein: <em>endocytosis</em> takes material in by wrapping it in membrane; <em>exocytosis</em> pushes material out. Both use energy.</span></div>
  <div class="callout warn">If a cell runs out of ATP — for example if it's poisoned or oxygen-starved — active transport stops first. Passive transport keeps going, because it never needed energy.</div>`},

 {kind:'vocab', title:'Vocabulary to lock in', html:
  V('Active transport','Movement of particles against the concentration gradient using cellular energy (ATP).') +
  V('ATP','Adenosine triphosphate — the molecule cells use to power work.') +
  V('Protein pump','A carrier protein that uses energy to move a substance against its gradient.') +
  V('Endocytosis / exocytosis','Bulk transport into / out of the cell using vesicles of membrane; both require energy.') +
  V('Against the gradient','From low concentration toward high concentration.')},

 {kind:'example', title:'Real-world example', html:`
  <p>Your kidneys filter roughly 180 liters of fluid a day, but you don't lose 180 liters of glucose and salt. Cells lining the kidney tubules use active transport to pump valuable solutes back into the blood — even though the blood already has more of them.</p>
  <p>That's why kidney cells are packed with mitochondria: the ATP demand is enormous.</p>`},

 {kind:'think', title:'Think about it', html:`
  <p>A cell is treated with a poison that blocks ATP production. Oxygen diffusion into the cell continues normally for a while, but potassium levels inside the cell slowly fall toward the outside concentration.</p>
  <p><strong>Explain both observations.</strong></p>
  <div class="callout think">One process needed the ATP. One never did.</div>`},

 {kind:'mistake', title:'Common mistake', html:`
  <div class="callout warn"><p><strong>Mistake:</strong> "Active transport is just faster diffusion."</p>
  <p>Speed isn't the difference — <em>direction</em> is. Active transport goes against the gradient, which diffusion can never do.</p></div>
  <div class="callout warn"><p><strong>Mistake:</strong> "Active transport happens whenever the cell is active."</p>
  <p>It's defined by ATP use and gradient direction, not by how busy the cell looks.</p></div>`},

 {kind:'check', q:{id:'chk_act_1', topic:'active', diff:'hard', type:'scenario',
  stem:'A root hair cell contains a higher concentration of nitrate ions than the surrounding soil, yet it continues taking in nitrate. What must be true?',
  choices:['The cell is using active transport, which requires ATP','Nitrate is diffusing down its concentration gradient','Osmosis is carrying the nitrate along with water','The membrane has become fully permeable to nitrate'],
  answer:0, hint:'Compare the concentration inside to the concentration outside, then ask which direction diffusion would go.',
  explain:'Nitrate is moving from lower concentration (soil) to higher concentration (cell) — against its gradient. Only active transport can do that, and it requires ATP.',
  why:{1:'Down the gradient would mean nitrate leaving the cell, which is the opposite of what is described.',2:'Osmosis moves water only; solutes are not dragged along in this way.',3:'Increased permeability would let nitrate leak out, not accumulate.'}}}
];

LESSONS.compare = [
 {kind:'simple', title:'One question sorts everything', html:`
  <p>For any transport process, ask: <strong>does the cell spend ATP?</strong></p>
  <p>No → <em>passive transport</em>, and the particle is moving high → low.<br>Yes → <em>active transport</em>, and the particle is moving low → high.</p>`, fig:figCompare},

 {kind:'deep', title:'The full sorting table', html:`
  <div class="vocab-item"><b>Simple diffusion</b><span><span style="color:var(--aqua)">PASSIVE</span> · high → low · straight through the bilayer · O₂, CO₂</span></div>
  <div class="vocab-item"><b>Facilitated diffusion</b><span><span style="color:var(--aqua)">PASSIVE</span> · high → low · uses a channel or carrier protein · glucose, ions</span></div>
  <div class="vocab-item"><b>Osmosis</b><span><span style="color:var(--aqua)">PASSIVE</span> · water moves toward higher solute · through the bilayer and aquaporins</span></div>
  <div class="vocab-item"><b>Protein pumps</b><span><span style="color:var(--amber)">ACTIVE</span> · low → high · ATP required · sodium-potassium pump</span></div>
  <div class="vocab-item"><b>Endocytosis / exocytosis</b><span><span style="color:var(--amber)">ACTIVE</span> · bulk material in vesicles · ATP required</span></div>
  <div class="callout">Traps to watch: a protein does <em>not</em> mean active. Osmosis is <em>always</em> passive. Direction, not machinery, is the deciding factor.</div>`},

 {kind:'vocab', title:'Vocabulary to lock in', html:
  V('Passive transport','Movement across a membrane with the concentration gradient, requiring no energy.') +
  V('Active transport','Movement against the concentration gradient, requiring ATP.') +
  V('Concentration gradient','The difference in concentration between two regions; transport is described relative to it.') +
  V('Equilibrium','The end point of passive transport — even concentrations, no net movement.')},

 {kind:'example', title:'Real-world example', html:`
  <p>A single nerve cell uses both at once. Sodium ions rush in through channels — facilitated diffusion, down their gradient, free. Then the sodium-potassium pump spends ATP to push that sodium back out, against the gradient, so the cell is ready to fire again.</p>
  <p>Roughly a quarter of the calories you burn at rest go to running these pumps.</p>`},

 {kind:'think', title:'Think about it', html:`
  <p>Passive transport ends at equilibrium. Active transport creates a difference.</p>
  <p><strong>If a cell only used passive transport, why could it never maintain homeostasis?</strong></p>
  <div class="callout think">Think about what "equal to the environment" would mean for a cell sitting in pond water.</div>`},

 {kind:'mistake', title:'Common mistake', html:`
  <div class="callout warn"><p><strong>Mistake:</strong> "Passive transport is for small molecules and active transport is for big ones."</p>
  <p>Size doesn't decide it. Glucose is large and enters passively; sodium is tiny and is pumped actively.</p></div>
  <div class="callout warn"><p><strong>Mistake:</strong> "Osmosis can be active transport if the cell needs water badly."</p>
  <p>Osmosis is always passive. Cells influence water movement indirectly — by pumping solutes.</p></div>`},

 {kind:'check', q:{id:'chk_cmp_1', topic:'compare', diff:'honors', type:'compare',
  stem:'Both facilitated diffusion and active transport use membrane proteins. What is the key difference between them?',
  choices:['Active transport moves substances against the gradient using ATP; facilitated diffusion moves them down the gradient with no ATP','Facilitated diffusion only moves water, while active transport moves solutes','Active transport is faster, while facilitated diffusion is slower','Facilitated diffusion happens only in plant cells'],
  answer:0, hint:'Both use proteins, so the protein cannot be the difference. What else could be?',
  explain:'The distinction is energy and direction. Facilitated diffusion is passive and follows the gradient; active transport spends ATP to push a substance against its gradient.',
  why:{1:'Water movement is osmosis; facilitated diffusion moves solutes such as glucose and ions.',2:'Rate is not the defining difference, and it varies by situation.',3:'Both processes occur in all cell types.'}}}
];

LESSONS.egglab = [
 {kind:'simple', title:'Why an egg works as a model cell', html:`
  <p>A chicken egg is a single enormous cell. Soaking it in vinegar dissolves the hard shell (calcium carbonate) and leaves a thin, flexible membrane you can actually see.</p>
  <p>That gives you a model cell big enough to <strong>weigh</strong> — so osmosis stops being invisible and becomes a number.</p>`, fig:figEgg},

 {kind:'deep', title:'What each part represents', html:`
  <div class="vocab-item"><b>The shell</b><span>Removed on purpose. It is not part of the model; it would block movement.</span></div>
  <div class="vocab-item"><b>The membrane under the shell</b><span>Models the <em>selectively permeable cell membrane</em>. Water crosses; large proteins do not.</span></div>
  <div class="vocab-item"><b>Egg white and yolk</b><span>Model the cytoplasm — mostly water with dissolved proteins and other solutes.</span></div>
  <div class="vocab-item"><b>The solution in the cup</b><span>Models the environment outside the cell. Changing it changes the tonicity.</span></div>
  <div class="callout">A model is a simplification. The egg membrane has no protein pumps, so the egg lab shows <em>osmosis and diffusion only</em> — never active transport.</div>`},

 {kind:'deep', title:'Turning mass into evidence', html:`
  <p>You can't see water molecules crossing, but you can measure what they leave behind: <strong>mass</strong>.</p>
  <div class="callout"><strong>Percent change in mass</strong> = (final mass − initial mass) ÷ initial mass × 100</p>
  <p>Percent change is used instead of raw grams because eggs start at different sizes. It makes results comparable between eggs and between lab groups.</p></div>
  <div class="vocab-item"><b>Mass increases (+ %)</b><span>Water moved INTO the egg → the solution was <em>hypotonic</em> to the egg.</span></div>
  <div class="vocab-item"><b>Mass decreases (− %)</b><span>Water moved OUT of the egg → the solution was <em>hypertonic</em> to the egg.</span></div>
  <div class="vocab-item"><b>Mass roughly unchanged</b><span>No net water movement → the solution was close to <em>isotonic</em>.</span></div>
  <p class="tiny muted">Use your own class data for actual values — results vary with concentration, soak time, and temperature.</p>`},

 {kind:'vocab', title:'Vocabulary to lock in', html:
  V('Model','A simplified representation used to study something that is hard to observe directly.') +
  V('Percent change in mass','(final − initial) ÷ initial × 100; used to compare eggs of different starting sizes.') +
  V('Independent variable','What you change on purpose — the solution the egg sits in.') +
  V('Dependent variable','What you measure — the mass of the egg.') +
  V('Controlled variable','What you keep the same — soak time, temperature, volume of solution, egg source.')},

 {kind:'example', title:'Real-world example', html:`
  <p>Suppose an egg starts at 62.0 g and, after soaking, comes out at 68.2 g.</p>
  <p>Percent change = (68.2 − 62.0) ÷ 62.0 × 100 = <strong>+10.0%</strong>. Mass went up, so water entered the egg, so that solution was hypotonic to the egg's contents.</p>
  <p class="tiny muted">These numbers are an example of the calculation, not a prediction of your class results.</p>`},

 {kind:'think', title:'Think about it', html:`
  <p>Two lab groups soak eggs in the same corn syrup solution. Group A's egg loses 8 g; Group B's loses 5 g.</p>
  <p><strong>Why can't you compare those numbers directly, and what should you calculate instead?</strong></p>`},

 {kind:'mistake', title:'Common mistake', html:`
  <div class="callout warn"><p><strong>Mistake:</strong> "The egg gained mass because it absorbed the syrup / the salt."</p>
  <p>The solutes are too large to cross. What moves is <em>water</em>.</p></div>
  <div class="callout warn"><p><strong>Mistake:</strong> "The solution pulled the water out."</p>
  <p>Nothing pulls. Water diffuses down its own concentration gradient toward the side with more solute.</p></div>
  <div class="callout warn"><p><strong>Mistake:</strong> Reporting raw grams as the result. Always convert to percent change so different-sized eggs can be compared.</p></div>`},

 {kind:'check', q:{id:'chk_egg_1', topic:'egglab', diff:'hard', type:'application',
  stem:'An egg has an initial mass of 50.0 g. After 24 hours in an unknown solution its mass is 44.0 g. What is the percent change, and what does it show?',
  choices:['−12%; the solution was hypertonic and water left the egg','−6%; the solution was hypotonic and water entered the egg','+12%; the solution was hypertonic and solute entered the egg','−12%; the solution was hypotonic and solute left the egg'],
  answer:0, hint:'Percent change = (final − initial) ÷ initial × 100. Then ask which way water had to move.',
  explain:'(44.0 − 50.0) ÷ 50.0 × 100 = −12%. Losing mass means water left the egg, so the surrounding solution had more solute — it was hypertonic to the egg.',
  why:{1:'−6 g is the change in grams, not the percent change; and mass loss means water left.',2:'The mass decreased, so the percent change is negative, and solutes do not cross the membrane.',3:'The calculation is right, but hypotonic would cause water to enter and mass to increase.'}}}
];

LESSONS.cer = [
 {kind:'simple', title:'What a CER actually is', html:`
  <p>CER is the structure scientists use to explain results. It has three parts:</p>
  <div class="vocab-item"><b>C — Claim</b><span>A one-sentence answer to the question. No data, no explanation — just the answer.</span></div>
  <div class="vocab-item"><b>E — Evidence</b><span>Specific data that supports the claim: numbers, units, observations, comparisons. Evidence comes from the lab, not from your head.</span></div>
  <div class="vocab-item"><b>R — Reasoning</b><span>The science that connects the evidence to the claim. This is where you name the concept — osmosis, hypertonic, selective permeability — and explain <em>why</em> that data means the claim is true.</span></div>`},

 {kind:'deep', title:'The difference students miss', html:`
  <p><strong>Evidence is what happened. Reasoning is why it matters.</strong></p>
  <div class="callout"><p><strong>Claim:</strong> The corn syrup solution was hypertonic to the egg.</p>
  <p><strong>Evidence:</strong> The egg's mass decreased from 50.0 g to 44.0 g, a change of −12%.</p>
  <p><strong>Reasoning:</strong> A decrease in mass means water left the egg. In osmosis, water moves across a selectively permeable membrane toward the side with a higher solute concentration. Since water left, the corn syrup must have had more solute than the inside of the egg, which makes it hypertonic.</p></div>
  <p>Notice the reasoning never introduces new data. It uses vocabulary and a rule to link the evidence to the claim.</p>`},

 {kind:'vocab', title:'Vocabulary to lock in', html:
  V('Claim','A statement that answers the question — one sentence, no hedging.') +
  V('Evidence','Specific, measurable data that supports the claim; includes numbers and units when available.') +
  V('Reasoning','The scientific principle that explains why the evidence supports the claim.') +
  V('Qualitative data','Observations described in words — color, texture, appearance.') +
  V('Quantitative data','Measured numerical data — grams, percent change, temperature.')},

 {kind:'example', title:'Real-world example', html:`
  <p>Question: Why did the celery in plain water become firm again?</p>
  <p><strong>Claim:</strong> The plain water was hypotonic to the celery cells.<br>
  <strong>Evidence:</strong> After 2 hours in water the celery stalks were rigid and had gained mass, while the stalks in salt water stayed limp and lost mass.<br>
  <strong>Reasoning:</strong> Plain water has a lower solute concentration than celery cytoplasm, so by osmosis water moved into the cells. That water increased turgor pressure against the cell walls, which made the stalks firm.</p>`},

 {kind:'think', title:'Think about it', html:`
  <p>A student writes: "The egg lost mass because of osmosis."</p>
  <p><strong>Which CER part is missing, and what would you add to fix it?</strong></p>
  <div class="callout think">The sentence names a process, but never gives the numbers or explains the direction water moved and why.</div>`},

 {kind:'mistake', title:'Common mistake', html:`
  <div class="callout warn"><p><strong>Mistake:</strong> Writing reasoning that just repeats the evidence. "The mass went down, which shows the mass went down" explains nothing.</p></div>
  <div class="callout warn"><p><strong>Mistake:</strong> Vague evidence — "the egg got smaller." Use numbers and units: "the mass decreased from 50.0 g to 44.0 g (−12%)."</p></div>
  <div class="callout warn"><p><strong>Mistake:</strong> A claim that hedges — "maybe the solution was hypertonic." Make the claim, then let the evidence defend it.</p></div>`},

 {kind:'check', q:{id:'chk_cer_1', topic:'cer', diff:'medium', type:'which',
  stem:'"Water moves across a selectively permeable membrane toward the higher solute concentration, so a mass decrease means water left the egg." Which part of a CER is this?',
  choices:['Reasoning','Claim','Evidence','Conclusion'],
  answer:0, hint:'Does the sentence state data, state an answer, or explain a scientific rule?',
  explain:'It states a scientific principle and uses it to connect the data to the claim. That is reasoning.',
  why:{1:'A claim is a direct answer to the question, such as "the solution was hypertonic."',2:'Evidence is specific measured data, such as a mass change in grams or percent.',3:'"Conclusion" is not one of the three CER components.'}}}
];

let genSeq = 0;
function mc(o){
  // o: {topic,diff,type,stem,correct,wrong[],hint,explain,whyMap{wrongText:reason}}
  const opts = shuffle([o.correct, ...o.wrong]);
  const why = {};
  opts.forEach((t,i)=>{ if(t!==o.correct && o.whyMap && o.whyMap[t]) why[i] = o.whyMap[t]; });
  return {id:'gen'+(++genSeq), topic:o.topic, diff:o.diff, type:o.type||'application',
    stem:o.stem, choices:opts, answer:opts.indexOf(o.correct), hint:o.hint, explain:o.explain, why};
}

function genTonicity(diff){
  const inside = [2,3,4,5,6,8,10][Math.floor(Math.random()*7)];
  let outside, kind;
  const r = Math.random();
  if(r<.38){ outside = inside + (1+Math.floor(Math.random()*6)); kind='hypertonic'; }
  else if(r<.76){ outside = Math.max(0, inside - (1+Math.floor(Math.random()*Math.max(1,inside-1)))); kind='hypotonic'; }
  else { outside = inside; kind='isotonic'; }
  const cellType = diff==='easy' ? 'cell' : rand(['red blood cell','plant cell','cheek cell','model cell']);
  const results = {
    hypertonic:{move:'out of the cell', size:'shrinks'},
    hypotonic:{move:'into the cell', size:'swells'},
    isotonic:{move:'both directions equally', size:'stays the same size'}
  }[kind];
  if(diff==='easy' || diff==='medium'){
    return mc({topic:'tonicity', diff, type:'scenario',
      stem:`A ${cellType} with an internal solute concentration of ${inside}% is placed in a ${outside}% solute solution. What happens?`,
      correct:`Water moves ${results.move}, so the cell ${results.size}`,
      wrong:[`Water moves ${kind==='hypertonic'?'into the cell, so the cell swells':(kind==='hypotonic'?'out of the cell, so the cell shrinks':'into the cell, so the cell swells')}`,
             `Solute moves until both sides reach ${((inside+outside)/2).toFixed(1)}%`,
             `Nothing moves because the membrane blocks water`],
      hint:'Water follows solute. Compare the two percentages first.',
      explain:`The solution is ${outside}% and the cell is ${inside}%, so the solution is ${kind} to the cell. Water moves toward the higher solute concentration, so it moves ${results.move} and the cell ${results.size}.`,
      whyMap:{[`Solute moves until both sides reach ${((inside+outside)/2).toFixed(1)}%`]:'Solutes usually cannot cross a selectively permeable membrane — only water moves.',
              'Nothing moves because the membrane blocks water':'The membrane is freely permeable to water; that is what makes osmosis possible.'}});
  }
  const Kind = kind[0].toUpperCase()+kind.slice(1);
  const oppositeOpt = kind==='hypertonic' ? 'Hypotonic; net water movement is into the cell'
    : kind==='hypotonic' ? 'Hypertonic; net water movement is out of the cell'
    : 'Hypertonic; net water movement is out of the cell';
  const thirdOpt = kind==='isotonic' ? 'Hypotonic; net water movement is into the cell'
    : 'Isotonic; there is no net water movement';
  return mc({topic:'tonicity', diff, type:'application',
    stem:`A ${cellType} with ${inside}% internal solute is placed in a ${outside}% solution. Which term describes the SOLUTION, and what is the net water movement?`,
    correct:`${Kind}; net water movement is ${results.move}`,
    wrong:[oppositeOpt, thirdOpt, `${Kind}; net SOLUTE movement is ${results.move}`],
    hint:'The prefix always describes the solution outside the cell, not the cell itself.',
    explain:`Outside is ${outside}% and inside is ${inside}%, so the solution is ${kind}. In osmosis water moves toward the higher solute concentration, so the net movement is ${results.move}.`,
    whyMap:{[oppositeOpt]:'That prefix describes the opposite situation. Compare the two percentages again — the prefix always describes the solution outside the cell.',
            [thirdOpt]:'Check the two percentages: they are not equal, so this is not the isotonic case.',
            [`${Kind}; net SOLUTE movement is ${results.move}`]:'The tonicity term is right, but in osmosis it is water that moves, not the solute.'}});
}

function genEggMass(diff){

  const pc = rand([-20,-15,-12,-10,-8,-5,5,8,10,12,15,20]);

  if(diff==='easy' || diff==='medium'){
    return mc({topic:'egglab', diff, type:'application',
      stem:`An egg has an initial mass of ${init.toFixed(1)} g. After soaking, its final mass is ${fin.toFixed(1)} g. What is the percent change in mass?`,
      correct:`${pc>0?'+':''}${pc}%`,

    whyMap:{[`${wrongPc[1]>0?'+':''}${wrongPc[1]}% — the solution was ${kind} to the egg`]:'The tonicity is right, but that number is the change in grams rather than the percent change.'}});

function bankFor(topics, diffs){
  return BANK.filter(x=>(!topics||topics.includes(x.topic)) && (!diffs||diffs.includes(x.diff)));
}
function pickQuestion(topics, diffs, used=new Set()){
  const ts = topics && topics.length ? topics : TOPICS.map(x=>x.id);
  const ds = diffs && diffs.length ? diffs : DIFFS;
  const t = rand(ts), d = rand(ds);
  const fromGen = (topic) => { const g = rand(GENERATORS[topic])(d); g.topic = topic; return g; };
  const pool = bankFor([t],[d]).filter(x=>!used.has(x.id));
  if(GENERATORS[t] && (pool.length === 0 || Math.random() < 0.42)) return fromGen(t);
  if(pool.length) return rand(pool);
  const alt = bankFor(ts,[d]).filter(x=>!used.has(x.id));      // same difficulty, another allowed topic
  if(alt.length) return rand(alt);
  const genTopics = ts.filter(x=>GENERATORS[x]);               // still same difficulty, freshly generated
  if(genTopics.length) return fromGen(rand(genTopics));
  const wide = bankFor(ts,null).filter(x=>!used.has(x.id));    // only now relax difficulty
  if(wide.length) return rand(wide);
  return rand(bankFor(null,[d]));
}
function buildQuiz(topics, diffs, count){
  const used = new Set(), stems = new Set(), out = [];
  function tryFill(df, guardMax){
    let guard = 0;
    while(out.length < count && guard++ < guardMax){
      const q = pickQuestion(topics, df, used);
      if(!q) return;
      if(stems.has(q.stem)) continue;
      if(q.id && q.id.indexOf('gen')!==0) used.add(q.id);
      stems.add(q.stem); out.push(q);
    }
  }
  tryFill(diffs, count*40);
  if(out.length < count) tryFill(null, count*40);      // widen difficulty before giving up
  let unique = out.length;
  while(out.length < count && out.length){             // narrow topic: repeat rather than cut the quiz short
    out.push(out[out.length % unique]);
  }
  if(unique < count && unique > 0) toast(`Only ${unique} unique questions fit those settings — some will repeat`);
  return shuffle(out);
}

const KEYS = ['A','B','C','D','E'];

function questionCard(q, opts={}){
  const mode = opts.mode || 'practice';
  const wrap = document.createElement('div');
  wrap.className = 'card';
  wrap.dataset.qcard = '1';
  const nextLabel = opts.nextLabel || 'Next question';
  const t = TOPIC_BY_ID[q.topic];

  wrap.innerHTML = `
    <div class="row" style="justify-content:space-between">
      <div class="row" style="gap:8px">

    </div>

    <div class="row" style="margin-top:16px;justify-content:space-between">

      <button class="btn btn-primary" data-a="submit" disabled>${mode==='quiz' ? (opts.index+1===opts.total ? 'Submit and finish' : 'Submit answer') : 'Check answer'}</button>

  const choicesEl = $('.choices',wrap), afterEl = $('.q-after',wrap), hintEl = $('.q-hint',wrap), submitBtn = $('[data-a="submit"]',wrap);

    <button class="choice" data-i="${i}"><span class="key">${KEYS[i]}</span><span>${esc(c)}</span></button>`).join('');

  choicesEl.addEventListener('click', e=>{
    const b = e.target.closest('.choice'); if(!b || submitted) return;
    picked = +b.dataset.i;
    $$('.choice',choicesEl).forEach(x=>x.classList.toggle('sel', x===b));
    submitBtn.disabled = false;
  });

  wrap.addEventListener('click', e=>{
    const a = e.target.closest('[data-a]'); if(!a) return;

      if($('.hint-box',hintEl)) return;

    }
    if(act==='submit') doSubmit();
    if(act==='next' && opts.onNext) opts.onNext(picked === q.answer, picked);
    if(act==='lfm-next'){ lfmStep++; renderLFM(); }
    if(act==='reveal'){ lfmStep = 9; renderLFM(); }
    if(act==='try-similar'){ lfmStep = 3; renderLFM(); }
  });

  function doSubmit(){
    if(submitted || picked === null) return;
    submitted = true;
    const correct = picked === q.answer;
    $$('.choice',choicesEl).forEach((el,i)=>{
      el.disabled = true;
      if(mode==='quiz'){ if(i===picked) el.classList.add('sel'); return; }
      if(i===q.answer && (correct || lfmDisabled())) el.classList.add('correct');
      if(i===picked && !correct) el.classList.add('wrong');
    });
    submitBtn.style.display = 'none';
    if(opts.autoRecord !== false) recordAnswer(q.topic, correct, q);
    if(mode==='quiz'){ if(opts.onNext) opts.onNext(correct, picked); return; }
    if(correct){
      wrap.querySelector('.q-hint').innerHTML = '';

          <button class="btn btn-sm btn-ghost" data-a="reveal">Just show the answer</button>
          <button class="btn btn-sm btn-violet" data-a="lfm-next">Give me a hint</button>
        </div></div>`;
    } else if(lfmStep===2){
      afterEl.innerHTML = `<div class="lfm">${stepsBar(2)}
        <span class="mono tiny" style="color:var(--violet);letter-spacing:.14em">LEARN FROM THIS · STEP 3</span>
        <h4>Here's your hint</h4>
        <p style="margin:0 0 12px">${esc(q.hint||'Identify the concept being tested, then check each option against the rule.')}</p>
        <div class="row" style="justify-content:space-between">
          <button class="btn btn-sm btn-ghost" data-a="reveal">Just show the answer</button>
          <button class="btn btn-sm btn-violet" data-a="try-similar">Try a similar question</button>
        </div></div>`;
    } else if(lfmStep===3){
      afterEl.innerHTML = `<div class="lfm">${stepsBar(3)}
        <span class="mono tiny" style="color:var(--violet);letter-spacing:.14em">LEARN FROM THIS · STEP 4</span>
        <h4>Same idea, new question</h4>
        <div class="lfm-slot"></div></div>`;
      similar = pickQuestion([q.topic], [q.diff], new Set([q.id]));
      let guard = 0;
      while(similar && similar.stem === q.stem && guard++ < 8) similar = pickQuestion([q.topic],[q.diff], new Set([q.id]));
      const slot = $('.lfm-slot',afterEl);
      const sub = questionCard(similar, {mode:'practice', lfm:false, onCorrectToast:false, nextLabel:'Back to the question you missed', onNext:(ok)=>{
        lfmStep = 9; renderLFM();
        if(ok) toast('Nice — that is the same idea as the one you missed','good');
      }});
      slot.appendChild(sub);
      mountSims(slot);
    } else {
      $$('.choice',choicesEl).forEach((el,i)=>{ if(i===q.answer) el.classList.add('correct'); });
      afterEl.innerHTML = `<div class="feedback no"><h4>The correct answer was ${KEYS[q.answer]} — ${esc(q.choices[q.answer])}</h4>
        <p style="margin:0">${esc(q.explain)}</p></div>
        <p class="tiny muted" style="margin-top:10px">Saved to Review Mistakes. You'll see this idea again — get it right twice and it retires.</p>
        <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn btn-primary" data-a="next">Next question</button></div>`;
    }
  }
  return wrap;
}

function renderLesson(id){

  S.lastTopic = id; save();

  function paint(){
    const st = steps[i], KINDS = {simple:'Start here',deep:'Go deeper',vocab:'Vocabulary',example:'Real-world example',think:'Think about it',mistake:'Common mistake',check:'Quick check',build:'Build your own CER'};
    v.innerHTML = `

      </div>
      <div class="row" style="justify-content:space-between;margin-top:18px">

        <button class="btn btn-primary" data-a="next">${i===steps.length-1?'Finish topic':'Next →'}</button>
      </div>`;
    const body = $('#stepBody');
    if(st.kind==='check'){
      body.innerHTML = `<p class="muted tiny" style="margin-bottom:14px">Answer this to lock the topic in. Miss it and you'll get walked through it.</p>`;
      const card = questionCard(st.q, {mode:'practice', onNext:()=>{ nextStep(); }});
      card.style.border = 'none'; card.style.background = 'transparent'; card.style.boxShadow = 'none'; card.style.padding = '0';
      body.appendChild(card);
    } else if(st.kind==='build'){
      body.appendChild(cerBuilder());
    } else {
      body.innerHTML = st.html || '';

  v.addEventListener('click', e=>{
    const a = e.target.closest('[data-a]'); if(!a) return;
    if(a.closest('[data-qcard]')) return;   // the quick-check card drives its own buttons
    if(a.dataset.a==='prev'){ i = Math.max(0,i-1); S.lessons[id].step = i; save(); paint(); }
    if(a.dataset.a==='next') nextStep();
  });
  function nextStep(){
    if(i === steps.length-1){
      const first = !S.lessons[id].done;
      S.lessons[id].done = true; S.lessons[id].step = steps.length;
      if(first){
        rollDay(); S.daily.topics++; markStudied();
        S.mastery[id].m = Math.max(S.mastery[id].m, 35);
        toast(`${t.short} lesson complete`, 'good');
      }
      save();
      go('learn');
      return;
    }
    i++; S.lessons[id].step = i; save(); paint();
  }
  paint();
}

        ${idx<CER_SCENARIOS.length-1?`<button class="btn btn-sm" data-a="nextsc" style="margin-left:auto">Next scenario →</button>`:''}
      </div>
      <div class="cer-out"></div>`;
  }
  el.addEventListener('click', e=>{
    const a = e.target.closest('[data-a]'); if(!a) return;
    const sc = CER_SCENARIOS[idx], out = $('.cer-out',el);
    if(a.dataset.a==='nextsc'){ idx++; paint(); return; }
    if(a.dataset.a==='model'){
      out.innerHTML = `<div class="callout" style="margin-top:16px"><h4 style="font-size:15px;margin-bottom:8px">Model response</h4>
        <p><b>Claim:</b> ${esc(sc.model.c)}</p><p><b>Evidence:</b> ${esc(sc.model.e)}</p><p style="margin:0"><b>Reasoning:</b> ${esc(sc.model.r)}</p></div>`;
      return;
    }
    if(a.dataset.a==='grade'){
      const c = $('[data-f="c"]',el).value.trim(), ev = $('[data-f="e"]',el).value.trim(), r = $('[data-f="r"]',el).value.trim();
      if(!c && !ev && !r){ toast('Write at least one section, then ask for feedback','bad'); return; }
      out.innerHTML = gradeCER(c, ev, r, sc);
      rollDay(); markStudied();
      S.mastery.cer.m = clamp(S.mastery.cer.m + 6, 0, 100); save();
    }
  });
  paint();
  return el;
}
function gradeCER(c, ev, r, sc){
  const low = s => s.toLowerCase();
  const hasNum = s => /\d/.test(s), hasUnit = s => /(\bg\b|gram|%|percent)/i.test(s);
  const rlow = low(r), clow = low(c);
  const claimOk = c.length > 8 && sc.claimTerms.some(k=>clow.includes(k));
  const claimHedge = /(maybe|might be|i think|probably|not sure)/i.test(c);
  const evOk = hasNum(ev) && hasUnit(ev) && ev.length > 15;
  const evPartial = ev.length > 8;
  const sciTerms = sc.keyTerms.filter(k=>rlow.includes(k));
  const connect = /(because|since|therefore|so that|this shows|which means|as a result|so)/i.test(r);
  const rRepeat = r.length>0 && ev.length>0 && low(r).replace(/\s+/g,'') === low(ev).replace(/\s+/g,'');
  const reasonOk = sciTerms.length >= 2 && connect && r.split(/\s+/).length >= 18 && !rRepeat;
  const reasonPartial = (sciTerms.length >= 1 || connect) && r.length > 15;

  const row = (label, state, text) => {
    const col = state==='met'?'var(--green)':(state==='part'?'var(--amber)':'var(--rose)');
    const bg  = state==='met'?'var(--green-dim)':(state==='part'?'var(--amber-dim)':'var(--rose-dim)');
    const word= state==='met'?'Met':(state==='part'?'Partly there':'Not yet');
    return `<div style="padding:12px 14px;border-radius:12px;background:${bg};border:1px solid ${col};margin-bottom:9px">
      <div class="spread"><b style="font-size:14px">${label}</b><span class="lvl" style="color:${col};background:transparent;border:1px solid ${col}">${word}</span></div>
      <p class="tiny" style="margin:6px 0 0;color:var(--text-2)">${text}</p></div>`;
  };
  let score = 0;
  const parts = [];
  parts.push(row('Scientific accuracy', claimOk && !claimHedge ? 'met' : (c.length>8?'part':'no'),
    !c ? 'Write a claim first — one sentence that directly answers the question.' :
    claimHedge ? 'Your claim hedges. Delete words like "maybe" or "I think" and state the answer directly; the evidence is what defends it.' :
    claimOk ? 'Your claim uses the correct scientific term and answers the question directly.' :
    `Your claim is missing the key vocabulary this scenario is testing. Name the specific term (for example: ${sc.claimTerms[0]}...).`));
  if(claimOk && !claimHedge) score++;

  parts.push(row('Evidence', evOk ? 'met' : (evPartial ? 'part' : 'no'),
    !ev ? 'Add evidence — the specific numbers from the data given above.' :
    evOk ? 'Good — you used specific measured data with numbers and units.' :
    'Add numbers and units. "The egg got lighter" is an observation; "the mass fell from 55.0 g to 47.3 g (−14%)" is evidence.'));
  if(evOk) score++;

  parts.push(row('Reasoning', reasonOk ? 'met' : (reasonPartial ? 'part' : 'no'),
    !r ? 'Add reasoning — the scientific rule that explains why your evidence supports your claim.' :
    rRepeat ? 'Your reasoning repeats your evidence word for word. Reasoning has to explain WHY that data means what you claim.' :
    reasonOk ? `You named the science (${sciTerms.join(', ')}) and connected it to your claim.` :
    `Strengthen this by naming the process and the rule. Terms that belong here: ${sc.keyTerms.slice(0,3).join(', ')}. Then use a connecting word like "because" or "therefore".`));
  if(reasonOk) score++;

  parts.push(row('Connection between evidence and claim', (evOk && reasonOk && connect) ? 'met' : ((evOk||reasonOk)?'part':'no'),
    (evOk && reasonOk && connect) ? 'Your reasoning ties the specific data to the claim — that is exactly what a complete CER does.' :
    'The three parts should read as one argument: claim, then the data, then the rule that links the data to the claim.'));
  if(evOk && reasonOk && connect) score++;

  const pct = Math.round(score/4*100);
  return `<div style="margin-top:18px">
    <div class="spread" style="margin-bottom:12px"><h4 style="font-size:16px">Feedback</h4>
    <span class="lvl" style="color:${levelOf(pct).color};background:${levelOf(pct).dim}">${score} of 4 criteria met</span></div>
    ${parts.join('')}
    <button class="btn btn-sm btn-ghost" data-a="model" style="margin-top:6px">Compare with a model response</button></div>`;
}

function runQuiz(qs, label){
  const v = $('#view');
  let i = 0; const answers = [];

      <h3 style="font-size:17px">Nothing flagged for review</h3>
      <p class="tiny">When you mark a card "Need to review," it lands here. Pick another deck above to keep studying.</p>
      <button class="btn btn-sm btn-primary" style="margin-top:14px" data-fc="all">Study all cards</button></div>`;
    return;
  }
  let i = 0, flipped = false, order = shuffle(deck);
  function paint(){
    const c = order[i], st = S.cards[c.t]?.status;
    slot.innerHTML = `
      <div class="spread" style="margin-bottom:12px">
        <span class="quiz-count">Card ${i+1} of ${order.length}</span>
        ${st?`<span class="badge ${st==='known'?'b-easy':'b-hard'}">${st==='known'?'Marked known':'Needs review'}</span>`:'<span class="badge">New card</span>'}
      </div>
      <div class="fc-scene"><div class="fc ${flipped?'flipped':''}" id="theCard">
        <div class="fc-face">
          <div class="fc-hint">${esc(TOPIC_BY_ID[c.topic].short)}</div>
          <div class="fc-term">${esc(c.t)}</div>
          <div class="fc-hint">Tap the card to flip</div>
        </div>
        <div class="fc-face fc-back">
          <div class="fc-row"><span class="lbl">Definition</span>${esc(c.d)}</div>
          <div class="fc-row"><span class="lbl">Example</span>${esc(c.ex)}</div>
          <div class="fc-row"><span class="lbl">Why it matters</span>${esc(c.why)}</div>
        </div>
      </div></div>
      <div class="row" style="justify-content:center;margin-top:20px">
        <button class="btn" data-f="review">Need to review</button>
        <button class="btn btn-primary" data-f="known">Got it</button>
      </div>
      <div class="row" style="justify-content:center;margin-top:10px">
        <button class="btn btn-sm btn-ghost" data-f="flip">Flip card</button>
      </div>`;
    $('#theCard').addEventListener('click', ()=>{ flipped = !flipped; $('#theCard').classList.toggle('flipped', flipped); });
  }
  slot.addEventListener('click', e=>{
    const b = e.target.closest('[data-f]'); if(!b) return;
    const c = order[i];
    if(b.dataset.f==='flip'){ flipped = !flipped; $('#theCard').classList.toggle('flipped', flipped); return; }
    const rec = S.cards[c.t] || (S.cards[c.t] = {status:'new', seen:0, missed:0});
    rec.seen++;
    if(b.dataset.f==='known'){ rec.status = 'known'; }
    else { rec.status = 'review'; rec.missed++; toast(`"${c.t}" added to your review deck`); }
    rollDay(); S.daily.cards++; markStudied(); save();
    i++; flipped = false;
    if(i>=order.length){
      const struggled = order.filter(x=>S.cards[x.t]?.status==='review');
      slot.innerHTML = `<div class="card empty">
        <div class="ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#5BE59A" stroke-width="1.8"><path d="M5 13l4 4L19 7"/></svg></div>
        <h3 style="font-size:18px">Deck finished — ${order.length} cards</h3>
        <p class="tiny">${struggled.length?`You flagged ${struggled.length} to review: ${struggled.map(x=>esc(x.t)).join(', ')}.`:'You marked every card as known. Strong session.'}</p>
        <div class="row" style="justify-content:center;margin-top:16px">
          <button class="btn btn-sm btn-primary" data-f="again">Shuffle and go again</button>
          ${struggled.length?`<button class="btn btn-sm" data-fc="review">Study flagged cards</button>`:''}
        </div></div>`;
      return;
    }
    paint();
  });
  slot.addEventListener('click', e=>{ if(e.target.closest('[data-f="again"]')){ i=0; flipped=false; order = shuffle(deck); paint(); } });
  paint();
}

/* ------------------------------- PROGRESS ------------------------------- */
function viewProgress(){
  const v = $('#view'), om = overallMastery();
  const acc = S.totals.answered ? Math.round(S.totals.correct/S.totals.answered*100) : 0;
  v.innerHTML = `
    <div class="eyebrow">Progress</div>
    <h1 class="page-title">Your mastery</h1>
    <p class="page-sub">Mastery rises when you answer correctly and dips when you miss — recent answers count most, so a bad day is always fixable.</p>
    ${bilayer()}
    <div class="grid g4" style="margin-top:22px">
      <div class="stat"><div class="k">Overall mastery</div><div class="v">${om}<small>%</small></div></div>
      <div class="stat"><div class="k">Accuracy</div><div class="v">${acc}<small>%</small></div></div>
      <div class="stat"><div class="k">Questions answered</div><div class="v">${S.totals.answered}</div></div>
      <div class="stat"><div class="k">Quizzes taken</div><div class="v">${S.quizzes.length}</div></div>
    </div>
    <div class="section-head"><h2>Topic by topic</h2><span class="tiny muted mono">0–39 Needs Work · 40–59 Learning · 60–79 Developing · 80–94 Strong · 95+ Mastered</span></div>
    <div class="card">
      ${TOPICS.map(t=>{
        const m = Math.round(S.mastery[t.id].m), lv = levelOf(m), st = S.mastery[t.id];
        return `<div class="mastery-row">
          <span class="nm">${esc(t.short)}<br><span class="tiny muted mono">${st.attempts} answered · ${st.attempts?Math.round(st.correct/st.attempts*100):0}% correct</span></span>
          ${bar(m)}
          <span class="pc" style="color:${lv.color}">${m}%</span>
          <span class="lvl" style="color:${lv.color};background:${lv.dim}">${lv.name}</span>
        </div>`;
      }).join('')}
    </div>
    ${S.quizzes.length?`<div class="section-head"><h2>Quiz history</h2></div>
    <div class="card">${S.quizzes.slice().reverse().map(qz=>`
      <div class="mastery-row"><span class="nm">${esc(qz.label)}<br><span class="tiny muted mono">${qz.date} · ${qz.score}/${qz.total}</span></span>
      ${bar(qz.pct)}<span class="pc" style="color:${levelOf(qz.pct).color}">${qz.pct}%</span></div>`).join('')}</div>`:''}
    <div class="section-head"><h2>Saved data</h2></div>
    <div class="card">
      <p class="tiny muted" style="margin-top:0">Everything above is stored in this browser with localStorage, so it survives refreshing and closing the tab. Clearing it cannot be undone.</p>
      <button class="btn btn-sm" data-a="reset">Clear all progress</button>
      <span class="tiny muted" id="resetNote" style="margin-left:10px"></span>
    </div>`;
  animateRings(v);
  let armed = false;
  v.addEventListener('click', e=>{
    if(!e.target.closest('[data-a="reset"]')) return;
    if(!armed){ armed = true; $('#resetNote').textContent = 'Click again to confirm — this erases mastery, streak, and mistakes.'; return; }
    localStorage.removeItem(KEY); S = blankState(); save(); paintStreak(); toast('Progress cleared','bad'); go('progress');
  });
}

/* ---------------------------- REVIEW MISTAKES ---------------------------- */
function prioritizedMistakes(){
  return Object.entries(S.mistakes).map(([k,v])=>({key:k, ...v}))
    .sort((a,b)=>{
      if(b.missCount !== a.missCount) return b.missCount - a.missCount;
      const ma = S.mastery[a.topic]?.m||0, mb = S.mastery[b.topic]?.m||0;
      if(ma !== mb) return ma - mb;
      return a.lastSeen - b.lastSeen;
    });
}
function viewMistakes(){
  const v = $('#view'), list = prioritizedMistakes();
  v.innerHTML = `
    <div class="eyebrow">Review Mistakes</div>
    <h1 class="page-title">Spaced review</h1>
    <p class="page-sub">Questions you missed come back here, hardest first. Answer one correctly twice and it retires from the list.</p>
    ${bilayer()}
    ${!list.length ? `
      <div class="card empty" style="margin-top:22px">
        <div class="ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#3ED8C4" stroke-width="1.8"><path d="M5 13l4 4L19 7"/></svg></div>
        <h3 style="font-size:18px">No mistakes saved yet</h3>
        <p class="tiny">Take a quiz or run a practice set. Anything you miss lands here automatically, sorted by how often you've missed it.</p>
        <div class="row" style="justify-content:center;margin-top:16px">
          <button class="btn btn-sm btn-primary" data-go="practice">Start practicing</button>
          <button class="btn btn-sm" data-go="quiz">Take a quiz</button>
        </div>
      </div>` : `
      <div class="row" style="margin:22px 0 14px;justify-content:space-between">
        <span class="badge">${list.length} question${list.length===1?'':'s'} waiting</span>
        <button class="btn btn-primary" data-a="startreview">Start review session</button>
      </div>
      <div class="grid" style="gap:10px">
        ${list.map(m=>`<div class="card pad-sm">
          <div class="row" style="justify-content:space-between">
            <div class="row" style="gap:8px">
              <span class="badge">${esc(TOPIC_BY_ID[m.topic].short)}</span>${diffBadge(m.q.diff)}
              ${m.missCount>1?`<span class="badge b-hard">Missed ${m.missCount}×</span>`:''}
              ${m.correctSince===1?`<span class="badge b-easy">1 more correct to retire</span>`:''}
            </div>
            <span class="tiny muted mono">${Math.round(S.mastery[m.topic].m)}% mastery</span>
          </div>
          <div class="tiny" style="margin-top:8px;color:var(--text-2)">${esc(m.q.stem).slice(0,150).replace(/\n/g,' ')}${m.q.stem.length>150?'…':''}</div>
        </div>`).join('')}
      </div>`}`;
  v.addEventListener('click', e=>{ if(e.target.closest('[data-a="startreview"]')) runReview(); });
}
function runReview(){
  const v = $('#view'), list = prioritizedMistakes();
  let i = 0, right = 0;
  function paint(){
    if(i >= list.length){
      v.innerHTML = `<div class="card empty">
        <div class="ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#5BE59A" stroke-width="1.8"><path d="M5 13l4 4L19 7"/></svg></div>
        <h3 style="font-size:18px">Review session finished</h3>
        <p class="tiny">${right} of ${list.length} correct. ${mistakeCount()?`${mistakeCount()} question${mistakeCount()===1?'':'s'} still on the list — a second correct answer retires each one.`:'Your review list is empty. Nicely done.'}</p>
        <div class="row" style="justify-content:center;margin-top:16px">
          <button class="btn btn-sm btn-primary" data-go="mistakes">Back to review list</button>
          <button class="btn btn-sm" data-go="dashboard">Dashboard</button>
        </div></div>`;
      buildNav();
      return;
    }
    const m = list[i];
    v.innerHTML = `
      <div class="row" style="justify-content:space-between;margin-bottom:14px">
        <button class="btn btn-sm btn-ghost" data-go="mistakes">← Review list</button>
        <span class="quiz-count">${i+1} of ${list.length} · missed ${m.missCount}×</span>
      </div>
      <div style="margin-bottom:16px">${bar(Math.round(i/list.length*100))}</div>
      <div id="rSlot"></div>`;
    animateRings(v);
    const card = questionCard(m.q, {mode:'practice', onNext:(ok)=>{ if(ok) right++; i++; buildNav(); paint(); }});
    $('#rSlot').appendChild(card); mountSims($('#rSlot'));
  }
  paint();
}

LESSONS.cer.push({kind:'build', title:'Now write your own CER'});
rollDay();
paintStreak();
buildNav();
go('dashboard');
</script>
