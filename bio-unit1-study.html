<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bio Unit 1 — Honors Biology Study Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg:#080D12;
  --bg-2:#0C131A;
  --surface:#111A22;
  --surface-2:#16212B;
  --line:rgba(255,255,255,.075);
  --line-strong:rgba(255,255,255,.14);

  --text:#E8EFF3;
  --text-2:#9DB0BD;
  --text-3:#63757F;

  --aqua:#3ED8C4;      /* water / passive transport */
  --aqua-dim:rgba(62,216,196,.14);
  --amber:#F5B455;     /* energy / ATP / active transport */
  --amber-dim:rgba(245,180,85,.14);
  --violet:#9A8CF8;    /* honors / reasoning */
  --violet-dim:rgba(154,140,248,.14);
  --rose:#FF7A85;      /* incorrect */
  --rose-dim:rgba(255,122,133,.13);
  --green:#5BE59A;     /* correct */
  --green-dim:rgba(91,229,154,.13);

  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:26px;
  --shadow:0 18px 40px -22px rgba(0,0,0,.9);
  --display:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
  --body:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sidebar-w:248px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--body);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(760px 460px at 12% -6%, rgba(62,216,196,.09), transparent 62%),
    radial-gradient(680px 420px at 92% 4%, rgba(154,140,248,.075), transparent 60%);
}
::selection{background:rgba(62,216,196,.28)}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.02em;line-height:1.2}
p{margin:0 0 10px}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--aqua);outline-offset:2px;border-radius:8px;
}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--text)}

/* ============================================================
   SIGNATURE: phospholipid bilayer hairline divider
   ============================================================ */
.bilayer{height:14px;width:100%;opacity:.5;flex:none}
.bilayer svg{display:block;width:100%;height:100%}

/* ============================================================
   APP SHELL
   ============================================================ */
.app{position:relative;z-index:1;display:flex;min-height:100vh}

.sidebar{
  width:var(--sidebar-w);flex:none;position:sticky;top:0;height:100vh;
  border-right:1px solid var(--line);
  background:linear-gradient(180deg,rgba(17,26,34,.85),rgba(8,13,18,.6));
  backdrop-filter:blur(12px);
  display:flex;flex-direction:column;padding:22px 14px 16px;gap:6px;
}
.brand{display:flex;align-items:center;gap:11px;padding:0 10px 16px}
.brand-mark{
  width:36px;height:36px;border-radius:11px;flex:none;
  background:linear-gradient(140deg,var(--aqua),#2b8fb8 60%,var(--violet));
  display:grid;place-items:center;box-shadow:0 6px 18px -8px var(--aqua);
}
.brand-mark svg{width:20px;height:20px}
.brand-name{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:-.02em}
.brand-sub{font-family:var(--mono);font-size:10px;color:var(--text-3);letter-spacing:.14em;text-transform:uppercase}

.nav-label{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--text-3);padding:12px 12px 6px;text-transform:uppercase}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border-radius:12px;
  color:var(--text-2);font-weight:500;font-size:14px;text-align:left;
  transition:background .18s ease,color .18s ease,transform .18s ease;
}
.nav-item svg{width:17px;height:17px;flex:none;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.045);color:var(--text)}
.nav-item.active{background:var(--aqua-dim);color:var(--aqua)}
.nav-item .badge-dot{margin-left:auto;background:var(--rose);color:#2b0d10;font-family:var(--mono);font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px}
.sidebar-foot{margin-top:auto;padding:12px 12px 0;border-top:1px solid var(--line)}
.streak-chip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
.streak-chip b{font-family:var(--mono);color:var(--amber)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:none;align-items:center;gap:10px;padding:12px 16px;
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;
  background:rgba(8,13,18,.86);backdrop-filter:blur(14px);
}
.view{padding:30px 34px 60px;max-width:1080px;width:100%;margin:0 auto;animation:viewIn .34s cubic-bezier(.22,.9,.3,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.mobile-nav{display:none}

/* ============================================================
   TYPE + PRIMITIVES
   ============================================================ */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--aqua);margin-bottom:8px}
.page-title{font-size:30px;font-weight:700}
.page-sub{color:var(--text-2);margin-top:6px;max-width:64ch}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin:34px 0 14px}
.section-head h2{font-size:19px}
.muted{color:var(--text-2)}
.tiny{font-size:12.5px}
.mono{font-family:var(--mono)}

.card{
  background:linear-gradient(180deg,var(--surface),rgba(12,19,26,.86));
  border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);
}
.card.pad-sm{padding:15px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;
  background:var(--surface-2);border:1px solid var(--line-strong);color:var(--text);
  transition:transform .16s ease,background .16s ease,border-color .16s ease,box-shadow .16s ease;
}
.btn:hover{background:#1b2833;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:linear-gradient(140deg,var(--aqua),#26b6ad);color:#04231f;border-color:transparent;box-shadow:0 10px 24px -14px var(--aqua)}
.btn-primary:hover{background:linear-gradient(140deg,#57e6d3,#2ac2b8)}
.btn-violet{background:linear-gradient(140deg,var(--violet),#6f5ee8);color:#0d0821;border-color:transparent}
.btn-ghost{background:transparent}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

.badge{
  display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:20px;
  border:1px solid var(--line-strong);color:var(--text-2);
}
.b-easy{color:var(--green);border-color:rgba(91,229,154,.35);background:var(--green-dim)}
.b-medium{color:var(--aqua);border-color:rgba(62,216,196,.35);background:var(--aqua-dim)}
.b-hard{color:var(--amber);border-color:rgba(245,180,85,.35);background:var(--amber-dim)}
.b-honors{color:var(--violet);border-color:rgba(154,140,248,.4);background:var(--violet-dim)}

.bar{height:7px;border-radius:20px;background:rgba(255,255,255,.07);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--aqua),var(--violet));width:0;transition:width .9s cubic-bezier(.22,.9,.3,1)}
.bar.amber > i{background:linear-gradient(90deg,var(--amber),#ff9d6b)}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 15px}
.stat .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-3)}
.stat .v{font-family:var(--display);font-size:25px;font-weight:700;margin-top:5px}
.stat .v small{font-size:13px;color:var(--text-2);font-weight:500}

.ring-wrap{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .ring-txt{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .ring-txt b{font-family:var(--display);font-size:30px;display:block;line-height:1}
.ring .ring-txt span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--text-3);text-transform:uppercase}

.chip-toggle{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  padding:7px 13px;border-radius:20px;border:1px solid var(--line-strong);
  background:transparent;color:var(--text-2);font-size:13px;font-weight:500;transition:all .16s ease;
}
.chip:hover{border-color:var(--aqua);color:var(--text)}
.chip.on{background:var(--aqua-dim);border-color:rgba(62,216,196,.5);color:var(--aqua)}

/* topic cards */
.topic-card{
  text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:17px;transition:transform .2s ease,border-color .2s ease,background .2s ease;
  display:flex;flex-direction:column;gap:10px;
}
.topic-card:hover{transform:translateY(-3px);border-color:rgba(62,216,196,.4);background:var(--surface-2)}
.topic-card h3{font-size:15.5px}
.topic-num{font-family:var(--mono);font-size:11px;color:var(--text-3)}

/* ============================================================
   LESSON
   ============================================================ */
.lesson-step{animation:stepIn .32s cubic-bezier(.22,.9,.3,1)}
@keyframes stepIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.step-kind{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.step-kind .dot{width:7px;height:7px;border-radius:50%;background:var(--aqua)}
.step-kind span{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3)}
.lesson-body{font-size:15.5px;line-height:1.72;color:#DCE7ED}
.lesson-body p{margin:0 0 12px}
.lesson-body strong{color:#fff}
.lesson-body em{color:var(--aqua);font-style:normal;font-weight:600}
.callout{border-left:3px solid var(--aqua);background:rgba(62,216,196,.06);padding:12px 15px;border-radius:0 12px 12px 0;margin:14px 0}
.callout.warn{border-color:var(--rose);background:rgba(255,122,133,.06)}
.callout.think{border-color:var(--violet);background:rgba(154,140,248,.06)}
.vocab-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.vocab-item:last-child{border-bottom:none}
.vocab-item b{font-family:var(--display);min-width:150px;flex:none;color:#fff}
.step-dots{display:flex;gap:5px;flex-wrap:wrap}
.step-dots i{width:22px;height:4px;border-radius:20px;background:rgba(255,255,255,.12);transition:background .3s}
.step-dots i.on{background:var(--aqua)}
.step-dots i.done{background:rgba(62,216,196,.4)}

/* ============================================================
   QUESTIONS
   ============================================================ */
.q-stem{font-size:16.5px;font-weight:500;line-height:1.55;margin:12px 0 16px;font-family:var(--display)}
.choices{display:flex;flex-direction:column;gap:9px}
.choice{
  display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  padding:13px 15px;border-radius:14px;border:1px solid var(--line-strong);
  background:rgba(255,255,255,.018);transition:all .16s ease;
}
.choice:hover:not(:disabled){border-color:var(--aqua);background:rgba(62,216,196,.06)}
.choice .key{
  font-family:var(--mono);font-size:12px;width:23px;height:23px;flex:none;border-radius:7px;
  display:grid;place-items:center;background:rgba(255,255,255,.07);color:var(--text-2);
}
.choice.sel{border-color:var(--aqua);background:var(--aqua-dim)}
.choice.sel .key{background:var(--aqua);color:#04231f}
.choice.correct{border-color:rgba(91,229,154,.6);background:var(--green-dim)}
.choice.correct .key{background:var(--green);color:#05230f}
.choice.wrong{border-color:rgba(255,122,133,.6);background:var(--rose-dim)}
.choice.wrong .key{background:var(--rose);color:#2b0d10}
.choice:disabled{cursor:default}
@keyframes shakeX{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(3px)}50%{transform:translateX(-3px)}}
.shake{animation:shakeX .4s}
@keyframes popIn{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.feedback{margin-top:16px;border-radius:14px;padding:14px 16px;animation:popIn .26s ease}
.feedback.ok{background:var(--green-dim);border:1px solid rgba(91,229,154,.3)}
.feedback.no{background:var(--rose-dim);border:1px solid rgba(255,122,133,.3)}
.feedback h4{font-size:14px;margin-bottom:6px}
.hint-box{margin-top:12px;background:var(--amber-dim);border:1px solid rgba(245,180,85,.3);border-radius:12px;padding:12px 14px;animation:popIn .24s ease}

/* Learn From Mistake */
.lfm{margin-top:16px;border:1px solid rgba(154,140,248,.35);background:linear-gradient(180deg,rgba(154,140,248,.1),rgba(154,140,248,.03));border-radius:16px;padding:17px;animation:popIn .3s ease}
.lfm-steps{display:flex;gap:6px;margin-bottom:14px}
.lfm-steps i{flex:1;height:3px;border-radius:20px;background:rgba(255,255,255,.12)}
.lfm-steps i.on{background:var(--violet)}
.lfm h4{font-size:15px;margin-bottom:8px;color:#fff}

/* quiz */
.quiz-top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.quiz-count{font-family:var(--mono);font-size:12px;color:var(--text-3);white-space:nowrap}
.score-big{font-family:var(--display);font-size:58px;font-weight:700;line-height:1;background:linear-gradient(120deg,var(--aqua),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}

/* flashcards */
.fc-scene{perspective:1400px;height:290px;margin:0 auto;max-width:560px}
.fc{position:relative;width:100%;height:100%;transition:transform .62s cubic-bezier(.3,.9,.3,1);transform-style:preserve-3d;cursor:pointer}
.fc.flipped{transform:rotateY(180deg)}
.fc-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:var(--r-xl);border:1px solid var(--line-strong);padding:26px;
  display:flex;flex-direction:column;justify-content:center;gap:12px;overflow:auto;
  background:linear-gradient(160deg,var(--surface-2),var(--surface));box-shadow:var(--shadow);
}
.fc-back{transform:rotateY(180deg);background:linear-gradient(160deg,#16242b,#101a21)}
.fc-term{font-family:var(--display);font-size:31px;font-weight:700;text-align:center}
.fc-hint{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);text-align:center}
.fc-row{margin-bottom:9px}
.fc-row .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--aqua);display:block;margin-bottom:2px}

/* toast */
.toasts{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:9px;z-index:200;pointer-events:none}
.toast{
  background:var(--surface-2);border:1px solid var(--line-strong);border-radius:13px;
  padding:11px 15px;font-size:13.5px;box-shadow:var(--shadow);animation:toastIn .3s cubic-bezier(.2,.9,.3,1);
  display:flex;gap:9px;align-items:center;max-width:330px;
}
.toast.out{animation:toastOut .3s ease forwards}
.toast .tdot{width:8px;height:8px;border-radius:50%;background:var(--aqua);flex:none}
.toast.good .tdot{background:var(--green)}
.toast.bad .tdot{background:var(--rose)}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px) scale(.97)}}

/* empty + loading */
.empty{text-align:center;padding:46px 22px;color:var(--text-2)}
.empty .ico{width:52px;height:52px;margin:0 auto 14px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;border:1px solid var(--line)}
.skeleton{background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:10px;height:14px}
@keyframes sk{to{background-position:-200% 0}}
.spinner{width:26px;height:26px;border-radius:50%;border:2.5px solid rgba(255,255,255,.14);border-top-color:var(--aqua);animation:spin .7s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* diagrams */
.figure{background:radial-gradient(120% 120% at 50% 0%,rgba(62,216,196,.07),transparent 60%),var(--bg-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin:16px 0}
.figure svg{display:block;width:100%;height:auto}
.figure figcaption{font-size:12.5px;color:var(--text-3);margin-top:10px;text-align:center;font-family:var(--mono)}
.sim-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}
.legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:10px;font-size:12px;color:var(--text-2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}

textarea.cer{
  width:100%;min-height:130px;background:var(--bg-2);border:1px solid var(--line-strong);
  border-radius:14px;padding:13px 15px;resize:vertical;line-height:1.6;
}
input[type=number],select{background:var(--bg-2);border:1px solid var(--line-strong);border-radius:10px;padding:8px 11px}

.mastery-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.mastery-row:last-child{border-bottom:none}
.mastery-row .nm{flex:1;min-width:0;font-weight:500}
.mastery-row .pc{font-family:var(--mono);font-size:13px;width:44px;text-align:right}
.mastery-row .bar{width:150px;flex:none}
.lvl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:20px;white-space:nowrap}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:940px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .sidebar{display:none}
  .topbar{display:flex}
  .view{padding:18px 16px 108px}
  .page-title{font-size:24px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .mastery-row .bar{width:88px}
  .fc-scene{height:320px}
  .toasts{left:12px;right:12px;bottom:82px;align-items:stretch}
  .toast{max-width:none}
  .mobile-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:60;
    background:rgba(10,16,21,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);
    padding:7px 4px calc(7px + env(safe-area-inset-bottom));justify-content:space-around;
  }
  .mnav{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 8px;border-radius:12px;color:var(--text-3);flex:1}
  .mnav svg{width:19px;height:19px}
  .mnav span{font-size:9.5px;font-family:var(--mono);letter-spacing:.04em}
  .mnav.active{color:var(--aqua);background:var(--aqua-dim)}
  .ring{width:112px;height:112px}
  .score-big{font-size:46px}
  .vocab-item{flex-direction:column;gap:2px}
  .vocab-item b{min-width:0}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#04231f" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="8.5"/><path d="M12 3.5c3 3 3 14 0 17M4.2 9h15.6M4.2 15h15.6"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Study Lab</div>
        <div class="brand-sub">Bio · Unit 1</div>
      </div>
    </div>
    <nav id="navList"></nav>
    <div class="sidebar-foot">

<script>
/* ============================================================================
   PART 1 — TOPICS, STATE, STORAGE, HELPERS, ROUTER
   ============================================================================ */
const TOPICS = [
  {id:'life',      name:'Characteristics of Living Things', short:'Characteristics of Life', blurb:'The eight traits every living thing shares.'},
  {id:'biomol',    name:'Biomolecules / Macromolecules',    short:'Biomolecules',            blurb:'Carbohydrates, lipids, proteins, nucleic acids.'},
  {id:'membrane',  name:'Cell Membrane',                    short:'Cell Membrane',           blurb:'Phospholipid bilayer and membrane proteins.'},
  {id:'permeable', name:'Selective Permeability',           short:'Selective Permeability',  blurb:'Why the membrane lets some things through.'},
  {id:'diffusion', name:'Diffusion',                        short:'Diffusion',               blurb:'Particles spreading down a gradient.'},
  {id:'facdiff',   name:'Facilitated Diffusion',            short:'Facilitated Diffusion',   blurb:'Passive transport through protein channels.'},
  {id:'osmosis',   name:'Osmosis',                          short:'Osmosis',                 blurb:'Diffusion of water across a membrane.'},
  {id:'tonicity',  name:'Hypotonic, Hypertonic, Isotonic',  short:'Tonicity',                blurb:'Predicting which way water moves.'},
  {id:'active',    name:'Active Transport',                 short:'Active Transport',        blurb:'Pumping particles up a gradient using ATP.'},
  {id:'compare',   name:'Passive vs. Active Transport',     short:'Passive vs Active',       blurb:'Sorting every process by energy use.'},
  {id:'egglab',    name:'Cell Model / Egg Lab',             short:'Egg Lab',                 blurb:'Using an egg as a model cell.'},
  {id:'cer',       name:'CER — Claim, Evidence, Reasoning', short:'CER',                     blurb:'Writing scientific explanations.'}
];
const TOPIC_BY_ID = Object.fromEntries(TOPICS.map(t=>[t.id,t]));
const DIFFS = ['easy','medium','hard','honors'];
const DIFF_LABEL = {easy:'Easy',medium:'Medium',hard:'Hard',honors:'Honors'};

const LEVELS = [
  {min:95,name:'Mastered',  color:'var(--green)',  dim:'var(--green-dim)'},
  {min:80,name:'Strong',    color:'var(--aqua)',   dim:'var(--aqua-dim)'},
  {min:60,name:'Developing',color:'var(--violet)', dim:'var(--violet-dim)'},
  {min:40,name:'Learning',  color:'var(--amber)',  dim:'var(--amber-dim)'},
  {min:0, name:'Needs Work',color:'var(--rose)',   dim:'var(--rose-dim)'}
];
function levelOf(pct){ return LEVELS.find(l=>pct>=l.min); }

/* ---------------------------- STATE / STORAGE ---------------------------- */
const KEY = 'bioUnit1.v1';
const todayStr = () => new Date().toISOString().slice(0,10);

function blankState(){
  const mastery = {}, lessons = {};
  TOPICS.forEach(t=>{ mastery[t.id] = {m:0, attempts:0, correct:0, lastSeen:0}; lessons[t.id] = {step:0, total:0, done:false}; });
  return {
    mastery, lessons,
    totals:{answered:0, correct:0},
    streak:{count:0, lastDay:null},
    daily:{day:todayStr(), topics:0, questions:0, cards:0},
    goals:{topics:2, questions:15, cards:10},
    cards:{},                 // term -> {status:'new|review|known', seen, missed}
    mistakes:{},              // key -> {q, topic, missCount, correctSince, lastSeen}
    quizzes:[],               // {date, scope, score, total, pct}
    lastTopic:null,
    seenQ:{}                  // qid -> times used (for variety)
  };
}
let S = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return blankState();
    const p = JSON.parse(raw), b = blankState();
    const merged = Object.assign(b, p);
    TOPICS.forEach(t=>{
      merged.mastery[t.id] = Object.assign({m:0,attempts:0,correct:0,lastSeen:0}, p.mastery?.[t.id]||{});
      merged.lessons[t.id] = Object.assign({step:0,total:0,done:false}, p.lessons?.[t.id]||{});
    });
    merged.goals = Object.assign({topics:2,questions:15,cards:10}, p.goals||{});
    merged.totals = Object.assign({answered:0,correct:0}, p.totals||{});
    merged.streak = Object.assign({count:0,lastDay:null}, p.streak||{});
    merged.daily  = Object.assign({day:todayStr(),topics:0,questions:0,cards:0}, p.daily||{});
    return merged;
  }catch(e){ console.warn('Save file unreadable, starting fresh.', e); return blankState(); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('Progress could not be saved — storage is full or blocked.','bad'); } }

function rollDay(){
  const t = todayStr();
  if(S.daily.day !== t){ S.daily = {day:t, topics:0, questions:0, cards:0}; save(); }
}
function markStudied(){
  const t = todayStr(), last = S.streak.lastDay;
  if(last === t) return;
  const y = new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak.count = (last === y) ? S.streak.count+1 : 1;
  S.streak.lastDay = t;
  save(); paintStreak();
  toast(S.streak.count>1 ? `Streak extended to ${S.streak.count} days` : 'Streak started — day 1','good');
}
function paintStreak(){
  const a=document.getElementById('sideStreak'), b=document.getElementById('sideStreak2');
  if(a) a.textContent = S.streak.count; if(b) b.textContent = S.streak.count;
}

/* ------------------------------- SCORING -------------------------------- */
function recordAnswer(topicId, correct, q){
  rollDay(); markStudied();
  const m = S.mastery[topicId] || (S.mastery[topicId] = {m:0,attempts:0,correct:0,lastSeen:0});
  m.attempts++; if(correct) m.correct++;
  m.lastSeen = Date.now();
  // exponential moving mastery: rewards recent accuracy, punishes misses a bit harder
  m.m = correct ? m.m + (100 - m.m)*0.19 : m.m - m.m*0.24;
  if(m.attempts < 6) m.m = Math.min(m.m, 90);      // can't be "Mastered" on 2 lucky guesses
  m.m = Math.max(0, Math.min(100, m.m));
  S.totals.answered++; if(correct) S.totals.correct++;
  S.daily.questions++;
  if(q) trackMistake(q, topicId, correct);
  save();
}
function qKey(q){ return q.id || (q.topic + '|' + q.stem.slice(0,70)); }
function trackMistake(q, topicId, correct){
  const k = qKey(q), rec = S.mistakes[k];
  if(!correct){
    S.mistakes[k] = {q:stripQ(q), topic:topicId, missCount:(rec?.missCount||0)+1, correctSince:0, lastSeen:Date.now()};
  } else if(rec){
    rec.correctSince++; rec.lastSeen = Date.now();
    if(rec.correctSince >= 2){ delete S.mistakes[k]; toast('Retired from Review Mistakes — you got it twice','good'); }
  }
}
function stripQ(q){ return {id:q.id, topic:q.topic, diff:q.diff, type:q.type, stem:q.stem, choices:q.choices, answer:q.answer, explain:q.explain, hint:q.hint, why:q.why||null, concept:q.concept||null}; }
function mistakeCount(){ return Object.keys(S.mistakes).length; }

function overallMastery(){ return Math.round(TOPICS.reduce((s,t)=>s+(S.mastery[t.id]?.m||0),0)/TOPICS.length); }
function topicsMastered(){ return TOPICS.filter(t=>(S.mastery[t.id]?.m||0)>=80).length; }
function rankedTopics(){ return TOPICS.slice().sort((a,b)=>(S.mastery[a.id]?.m||0)-(S.mastery[b.id]?.m||0)); }
function weakestTopic(){ const seen = TOPICS.filter(t=>S.mastery[t.id].attempts>0 || S.lessons[t.id].step>0); return (seen.length?seen:TOPICS).slice().sort((a,b)=>S.mastery[a.id].m-S.mastery[b.id].m)[0]; }
function strongestTopic(){ const seen = TOPICS.filter(t=>S.mastery[t.id].attempts>0); if(!seen.length) return null; return seen.sort((a,b)=>S.mastery[b.id].m-S.mastery[a.id].m)[0]; }

/* -------------------------------- HELPERS -------------------------------- */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rand = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { const c=a.slice(); for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];} return c; };
const clamp = (n,lo,hi)=>Math.max(lo,Math.min(hi,n));

function toast(msg, kind=''){
  const host = $('#toasts');
  if(!host) return;
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = `<i class="tdot"></i><span>${esc(msg)}</span>`;
  host.appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 320); }, 2900);
}
function bilayer(){
  return `<div class="bilayer" aria-hidden="true"><svg viewBox="0 0 600 14" preserveAspectRatio="none">
    <g fill="#3ED8C4" opacity=".55">${Array.from({length:40},(_,i)=>`<circle cx="${i*15+7}" cy="3" r="2.1"/><circle cx="${i*15+7}" cy="11" r="2.1"/>`).join('')}</g>
    <g stroke="#3ED8C4" stroke-width="1" opacity=".3">${Array.from({length:40},(_,i)=>`<path d="M${i*15+7} 5.2v2.2M${i*15+7} 8.8V6.6"/>`).join('')}</g></svg></div>`;
}
function ring(pct, label='Mastery', size=132){
  const r = size/2 - 9, c = 2*Math.PI*r, off = c*(1-pct/100);
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}">
      <defs><linearGradient id="rg${size}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3ED8C4"/><stop offset="1" stop-color="#9A8CF8"/></linearGradient></defs>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="9"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#rg${size})" stroke-width="9" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${c}" style="transition:stroke-dashoffset 1.1s cubic-bezier(.22,.9,.3,1)" data-off="${off}"/>
    </svg>
    <div class="ring-txt"><div><b data-count="${pct}">0</b><span>${esc(label)}</span></div></div>
  </div>`;
}
function animateRings(root=document){
  $$('.ring circle[data-off]',root).forEach(c=>{ requestAnimationFrame(()=>{ c.style.strokeDashoffset = c.dataset.off; }); });
  $$('[data-count]',root).forEach(el=>{
    const to = +el.dataset.count, t0 = performance.now(), dur = 900;
    const tick = t => { const p = clamp((t-t0)/dur,0,1), e = 1-Math.pow(1-p,3);
      el.textContent = Math.round(to*e) + (el.dataset.suffix||'%'); if(p<1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
  $$('.bar > i[data-w]',root).forEach(b=>{ requestAnimationFrame(()=>{ b.style.width = b.dataset.w + '%'; }); });
}
function bar(pct, cls=''){ return `<div class="bar ${cls}"><i data-w="${clamp(Math.round(pct),0,100)}"></i></div>`; }
function diffBadge(d){ return `<span class="badge b-${d}">${DIFF_LABEL[d]}</span>`; }

/* -------------------------------- ROUTER -------------------------------- */
const ICONS = {
  dashboard:'<path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  learn:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M9 7h6"/>',
  practice:'<path d="M12 3v18M5 8l14 8M19 8L5 16"/>',
  quiz:'<path d="M9 9a3 3 0 1 1 4 2.8c-.7.3-1 .9-1 1.7v.5"/><circle cx="12" cy="18" r=".6"/><rect x="3.5" y="3.5" width="17" height="17" rx="4"/>',
  flashcards:'<rect x="3" y="6" width="14" height="12" rx="3"/><path d="M8 3.5h10A2.5 2.5 0 0 1 20.5 6v9"/>',
  progress:'<path d="M4 19V9M10 19V4M16 19v-7M22 19H2"/>',
  mistakes:'<path d="M12 8v5M12 16.5v.2"/><path d="M10.3 3.6 2.6 17a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0z"/>'
};
const ROUTES = [
  {id:'dashboard',  label:'Dashboard',       render:()=>viewDashboard()},
  {id:'learn',      label:'Learn',           render:()=>viewLearn()},
  {id:'practice',   label:'Practice',        render:()=>viewPractice()},
  {id:'quiz',       label:'Quiz',            render:()=>viewQuiz()},
  {id:'flashcards', label:'Flashcards',      render:()=>viewFlashcards()},
  {id:'progress',   label:'Progress',        render:()=>viewProgress()},
  {id:'mistakes',   label:'Review Mistakes', render:()=>viewMistakes()}
];
let route = 'dashboard', routeArg = null, cleanups = [];
function onLeave(fn){ cleanups.push(fn); }
function go(id, arg=null){
  cleanups.forEach(f=>{ try{f();}catch(e){} }); cleanups = [];
  route = id; routeArg = arg;
  buildNav();
  const r = ROUTES.find(x=>x.id===id) || ROUTES[0];
  const stale = $('#view');
  const view = stale.cloneNode(false);   // fresh node => listeners from the last view are gone
  stale.replaceWith(view);
  view.innerHTML = '';
  r.render();
  animateRings(view);
  window.scrollTo({top:0,behavior:'instant'});
}
function buildNav(){
  const mc = mistakeCount();
  $('#navList').innerHTML = `<div class="nav-label">Unit 1</div>` + ROUTES.map(r=>`
    <button class="nav-item ${route===r.id?'active':''}" data-go="${r.id}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[r.id]}</svg>
      <span>${r.label}</span>${r.id==='mistakes'&&mc?`<span class="badge-dot">${mc}</span>`:''}
    </button>`).join('');
  $('#mobileNav').innerHTML = ROUTES.map(r=>`
    <button class="mnav ${route===r.id?'active':''}" data-go="${r.id}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[r.id]}</svg>
      <span>${r.id==='mistakes'?'Review':r.label}</span>
    </button>`).join('');
}
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-go]');
  if(b) go(b.dataset.go, b.dataset.arg || null);
});

/* ============================================================================
   PART 2 — DIAGRAMS & INTERACTIVE VISUALIZATIONS
   ============================================================================ */
function figure(inner, caption){ return `<figure class="figure">${inner}${caption?`<figcaption>${caption}</figcaption>`:''}</figure>`; }

/* --- Static: phospholipid bilayer with proteins ------------------------- */
function figMembrane(){
  const heads = (y, n=26) => Array.from({length:n},(_,i)=>{
    const x = 22 + i*22; if(x>250 && x<318) return ''; if(x>404 && x<452) return '';
    const dir = y<150 ? 1 : -1;
    return `<circle cx="${x}" cy="${y}" r="7.5" fill="#3ED8C4" opacity=".9"/>
            <path d="M${x-3} ${y+dir*8} q-2 12 0 20 M${x+3} ${y+dir*8} q2 12 0 20" stroke="#F5B455" stroke-width="2" fill="none" opacity=".75"/>`;
  }).join('');
  return figure(`<svg viewBox="0 0 600 250" role="img" aria-label="Phospholipid bilayer diagram">
    <rect x="0" y="0" width="600" height="250" fill="none"/>
    <text x="14" y="28" fill="#9DB0BD" font-size="13" font-family="JetBrains Mono, monospace">OUTSIDE THE CELL (water)</text>
    <text x="14" y="240" fill="#9DB0BD" font-size="13" font-family="JetBrains Mono, monospace">INSIDE THE CELL (water)</text>
    ${heads(112)}${heads(178)}
    <!-- channel protein -->
    <path d="M252 96 q-12 45 0 90 h20 q-10 -45 0 -90 z" fill="#9A8CF8" opacity=".85"/>
    <path d="M316 96 q12 45 0 90 h-20 q10 -45 0 -90 z" fill="#9A8CF8" opacity=".85"/>
    <text x="256" y="82" fill="#9A8CF8" font-size="12" font-family="JetBrains Mono, monospace">channel</text>
    <!-- carrier protein -->
    <rect x="404" y="94" width="48" height="94" rx="16" fill="#F5B455" opacity=".82"/>
    <text x="392" y="82" fill="#F5B455" font-size="12" font-family="JetBrains Mono, monospace">carrier / pump</text>
    <line x1="470" y1="112" x2="560" y2="112" stroke="#63757F" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="470" y="106" fill="#63757F" font-size="11" font-family="JetBrains Mono, monospace">phosphate head (loves water)</text>
    <line x1="470" y1="150" x2="560" y2="150" stroke="#63757F" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="470" y="168" fill="#63757F" font-size="11" font-family="JetBrains Mono, monospace">fatty acid tails (repel water)</text>
  </svg>`, 'Two layers of phospholipids — heads out, tails in — with proteins embedded through them.');
}

/* --- Interactive: diffusion -------------------------------------------- */
function figDiffusion(){
  return figure(`<div data-sim="diffusion">
    <svg viewBox="0 0 600 220" aria-label="Diffusion simulation">
      <rect x="8" y="8" width="584" height="204" rx="12" fill="rgba(255,255,255,.02)" stroke="rgba(255,255,255,.1)"/>
      <rect class="sim-barrier" x="296" y="8" width="8" height="204" fill="#9A8CF8" opacity=".8"/>
      <g class="sim-parts"></g>
      <text x="20" y="205" fill="#63757F" font-size="11" font-family="JetBrains Mono, monospace">high concentration</text>
      <text x="470" y="205" fill="#63757F" font-size="11" font-family="JetBrains Mono, monospace">low concentration</text>
    </svg>
    <div class="sim-controls">
      <button class="btn btn-sm btn-primary" data-act="open">Remove the barrier</button>
      <button class="btn btn-sm" data-act="reset">Reset</button>
      <span class="badge sim-read">Left 40 · Right 0</span>
    </div></div>`,
    'Particles move randomly. With no barrier, more of them end up spreading toward the low-concentration side until it evens out.');
}
function mountDiffusion(el){
  const svg = $('svg',el), g = $('.sim-parts',el), read = $('.sim-read',el), barrier = $('.sim-barrier',el);
  let parts = [], open = false, raf = 0;
  function reset(){
    open = false; barrier.style.opacity = .8;
    g.innerHTML = '';
    parts = Array.from({length:40},()=>{
      const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('r',5); c.setAttribute('fill','#3ED8C4'); c.setAttribute('opacity','.85');
      g.appendChild(c);
      return {x:20+Math.random()*264, y:20+Math.random()*180, vx:(Math.random()-.5)*2.6, vy:(Math.random()-.5)*2.6, el:c};
    });
  }
  function step(){
    let left=0;
    for(const p of parts){
      p.vx += (Math.random()-.5)*.5; p.vy += (Math.random()-.5)*.5;
      p.vx = clamp(p.vx,-2.2,2.2); p.vy = clamp(p.vy,-2.2,2.2);
      p.x += p.vx; p.y += p.vy;
      if(p.x<16){p.x=16;p.vx*=-1;} if(p.x>584){p.x=584;p.vx*=-1;}
      if(p.y<16){p.y=16;p.vy*=-1;} if(p.y>204){p.y=204;p.vy*=-1;}
      if(!open && p.x>288 && p.x<312){ p.x = p.x<300?288:312; p.vx*=-1; }
      p.el.setAttribute('cx',p.x.toFixed(1)); p.el.setAttribute('cy',p.y.toFixed(1));
      if(p.x<300) left++;
    }
    read.textContent = `Left ${left} · Right ${40-left}`;
    raf = requestAnimationFrame(step);
  }
  el.addEventListener('click', e=>{
    const a = e.target.closest('[data-act]'); if(!a) return;
    if(a.dataset.act==='open'){ open = true; barrier.style.opacity = .12; }
    else reset();
  });
  reset(); step();
  onLeave(()=>cancelAnimationFrame(raf));
}

/* --- Static: osmosis ---------------------------------------------------- */

  const dots = (x0,x1,n,fill,r=5) => Array.from({length:n},()=>`<circle cx="${(x0+Math.random()*(x1-x0)).toFixed(0)}" cy="${(48+Math.random()*130).toFixed(0)}" r="${r}" fill="${fill}" opacity=".85"/>`).join('');
  return figure(`<svg viewBox="0 0 600 230" aria-label="Osmosis across a selectively permeable membrane">

    <g stroke="#9A8CF8" stroke-width="3" opacity=".85"><path d="M300 30v164" stroke-dasharray="9 7"/></g>
    <text x="238" y="22" fill="#9A8CF8" font-size="11" font-family="JetBrains Mono, monospace">selectively permeable membrane</text>
    ${dots(30,280,10,'#F5B455',7)}${dots(320,570,26,'#F5B455',7)}
    ${dots(30,280,16,'#3ED8C4',3.4)}${dots(320,570,16,'#3ED8C4',3.4)}

function mountTonic(el){
  const cell = $('.tonic-cell',el), arrows = $('.tonic-arrows',el), sol = $('.tonic-solutes',el),
        label = $('.tonic-label',el), note = $('.tonic-note',el);
  const CFG = {
    hypotonic:{r:82, color:'#3ED8C4', outside:8, dir:'in',
      label:'Water moves INTO the cell → the cell swells',
      note:'Hypotonic = lower solute concentration outside the cell than inside. More free water outside, so the net movement of water is inward. An animal cell can swell and even burst (lyse).'},
    isotonic:{r:60, color:'#9DB0BD', outside:18, dir:'both',
      label:'Water moves in and out equally → no net change',
      note:'Isotonic = equal solute concentration inside and outside. Water still crosses the membrane constantly; the amounts just cancel out, so the cell stays the same size. This is dynamic equilibrium.'},
    hypertonic:{r:38, color:'#F5B455', outside:34, dir:'out',
      label:'Water moves OUT of the cell → the cell shrinks',
      note:'Hypertonic = higher solute concentration outside the cell than inside. More free water inside, so the net movement of water is outward. An animal cell shrivels (crenates).'}
  };
  function draw(k){
    const c = CFG[k];
    cell.setAttribute('r', c.r); cell.setAttribute('stroke', c.color);
    cell.setAttribute('fill', k==='hypertonic'?'rgba(245,180,85,.14)':(k==='isotonic'?'rgba(157,176,189,.12)':'rgba(62,216,196,.16)'));
    label.textContent = c.label; note.textContent = c.note;
    sol.innerHTML = Array.from({length:c.outside},()=>{
      let x,y,d; do{ x = 30+Math.random()*540; y = 30+Math.random()*170; d = Math.hypot(x-300,y-115); }while(d < c.r+16);
      return `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="6" fill="#F5B455" opacity=".8"/>`;
    }).join('');
    const arrow = (x1,y1,x2,y2,col)=>`<path d="M${x1} ${y1} L${x2} ${y2}" stroke="${col}" stroke-width="3.5" marker-end="url(#ah2)"/>`;
    const col = '#3ED8C4';
    let a = `<defs><marker id="ah2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="${col}"/></marker></defs>`;
    const R = c.r;
    if(c.dir==='in'){ a += arrow(300-R-58,115,300-R-12,115,col) + arrow(300+R+58,115,300+R+12,115,col) + arrow(300,115-R-58,300,115-R-12,col) + arrow(300,115+R+58,300,115+R+12,col); }
    else if(c.dir==='out'){ a += arrow(300-R-12,115,300-R-58,115,col) + arrow(300+R+12,115,300+R+58,115,col) + arrow(300,115-R-12,300,115-R-58,col) + arrow(300,115+R+12,300,115+R+58,col); }
    else { a += arrow(300-R-58,100,300-R-12,100,col) + arrow(300-R-12,132,300-R-58,132,col) + arrow(300+R+58,100,300+R+12,100,col) + arrow(300+R+12,132,300+R+58,132,col); }
    arrows.innerHTML = a;
  }
  el.addEventListener('click', e=>{
    const b = e.target.closest('[data-tonic]'); if(!b) return;
    $$('[data-tonic]',el).forEach(x=>x.classList.toggle('on', x===b));
    draw(b.dataset.tonic);
  });
  draw('hypotonic');
}

    </svg>

      <span class="badge">ATP used: <b class="pump-count mono" style="color:var(--amber);margin-left:4px">0</b></span>
    </div></div>`,

function mountPump(el){
  const out = $('.pump-out',el), inn = $('.pump-in',el), mover = $('.pump-moving',el),
        atp = $('.pump-atp',el), count = $('.pump-count',el);
  let outN = 14, inN = 6, used = 0, busy = false, raf = 0;
  const spot = (n, y0, y1) => Array.from({length:n},(_,i)=>({x:40+((i*67)%520), y:y0+((i*37)%(y1-y0))}));
  function draw(){
    out.innerHTML = spot(outN,26,92).map(p=>`<circle cx="${p.x}" cy="${p.y}" r="8" fill="#3ED8C4" opacity=".85"/>`).join('');
    inn.innerHTML = spot(inN,160,214).map(p=>`<circle cx="${p.x}" cy="${p.y}" r="8" fill="#3ED8C4" opacity=".85"/>`).join('');
  }
  function pump(){
    if(busy) return;
    if(inN<=0){ toast('No particles left inside to pump out','bad'); return; }
    busy = true; inN--; draw(); used++; count.textContent = used;
    atp.style.opacity = 1; mover.style.opacity = 1;
    const t0 = performance.now(), dur = 900;
    (function step(t){
      const p = clamp((t-t0)/dur,0,1), e = p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
      mover.setAttribute('cx', 300);
      mover.setAttribute('cy', 190 - e*130);
      if(p<1){ raf = requestAnimationFrame(step); }
      else { mover.style.opacity = 0; atp.style.opacity = 0; outN++; draw(); busy = false; }
    })(t0);
  }
  el.addEventListener('click', e=>{ if(e.target.closest('[data-act="pump"]')) pump(); });
  draw();
  onLeave(()=>cancelAnimationFrame(raf));
}

   PART 3A — LESSONS (topics 1–6)

const V = (t,d) => `<div class="vocab-item"><b>${t}</b><span>${d}</span></div>`;
const LESSONS = {};

LESSONS.life = [
 {kind:'simple', title:'What makes something alive?', html:`
  <p>A rock, a candle flame, and a frog all "do things." Only one of them is alive. Biologists don't decide this by feel — they check a list.</p>
  <p>To be considered <em>living</em>, something must show <strong>all</strong> of the characteristics of life, not just a few. A flame gives off heat and grows, but it can't respond to a stimulus, maintain homeostasis, or pass on DNA — so it isn't alive.</p>
  <div class="callout"><strong>The big idea:</strong> life is defined by a set of shared characteristics, and the unit of life is the <em>cell</em>.</div>`},

 {kind:'deep', title:'The characteristics, one at a time', html:`
  <p>Work through these until you can give an example of each from your own life.</p>
  <div class="vocab-item"><b>1 · Made of cells</b><span>Every living thing is made of one or more cells. Unicellular = one cell (bacteria). Multicellular = many cells (you).</span></div>
  <div class="vocab-item"><b>2 · Reproduction</b><span>Living things make more of their own kind — sexually or asexually. An individual can fail to reproduce; the species must be able to.</span></div>
  <div class="vocab-item"><b>3 · Growth &amp; development</b><span>Organisms get larger and change in an organized, DNA-directed way. A crystal gets bigger, but it doesn't <em>develop</em>.</span></div>
  <div class="vocab-item"><b>4 · DNA / hereditary material</b><span>Instructions are stored in DNA and passed to offspring.</span></div>
  <div class="vocab-item"><b>5 · Response to stimuli</b><span>A stimulus is a change in the environment; the response is what the organism does. Plant bends toward light; you pull your hand off a hot pan.</span></div>
  <div class="vocab-item"><b>6 · Homeostasis</b><span>Keeping a stable internal environment even when outside conditions change — temperature, water, pH.</span></div>
  <div class="vocab-item"><b>7 · Energy use (metabolism)</b><span>All the chemical reactions that take in, store, and use energy. Nothing living runs on nothing.</span></div>
  <div class="vocab-item"><b>8 · Evolution / adaptation</b><span>Populations change over generations as helpful traits become more common.</span></div>`},

 {kind:'vocab', title:'Vocabulary to lock in', html:
  V('Organism','Any individual living thing.') +
  V('Stimulus / response','A detectable change in the environment, and the reaction to it.') +
  V('Homeostasis','Maintaining stable internal conditions (temperature, water balance, pH).') +
  V('Metabolism','All chemical reactions in an organism that build molecules or release energy.') +
  V('Unicellular / multicellular','Made of one cell / made of many cells.')},

 {kind:'example', title:'Real-world example', html:`
  <p>You walk outside in February wearing a T-shirt. Within seconds you shiver, your skin gets goosebumps, and blood flow to your fingers drops.</p>
  <p>The cold is the <em>stimulus</em>. Shivering is the <em>response</em>. The purpose is <em>homeostasis</em> — holding your core temperature near 37 °C. Shivering costs energy, which your cells release through <em>metabolism</em>. One shiver just demonstrated three characteristics of life.</p>`},

 {kind:'think', title:'Think about it', html:`
  <p>A computer virus copies itself, "spreads," and changes over time as programmers modify it.</p>
  <p><strong>Which characteristics of life does it still fail?</strong> Try to name at least three before moving on.</p>
  <div class="callout think">Hint: start with the one characteristic that is the basic unit of all life.</div>`},

 {kind:'mistake', title:'Common mistake', html:`
  <div class="callout warn"><p><strong>Mistake:</strong> "It moves, so it's alive."</p>
  <p>Movement is not on the list. Rivers, clouds, and robots move; mosses and coral don't move much at all. What matters is whether <em>all</em> the characteristics are present — especially cells, DNA, homeostasis, and metabolism.</p></div>
  <div class="callout warn"><p><strong>Mistake:</strong> "Every living thing reproduces."</p>
  <p>A mule doesn't reproduce, and it's obviously alive. The characteristic belongs to the species, not to every individual at every moment.</p></div>`},

 {kind:'check', q:{id:'chk_life_1', topic:'life', diff:'medium', type:'scenario',
  stem:'A candle flame grows taller, gives off heat, and "consumes" wax. Which characteristic of life does it most clearly fail?',
  choices:['It is not made of cells','It does not give off energy','It does not change size','It does not use any material'],
  answer:0, hint:'Start with the most basic unit of life.',
  explain:'A flame is a chemical reaction, not a cell. It has no cells, no DNA, and no homeostasis — it cannot regulate itself, it just burns until the fuel runs out.',
  why:{1:'It clearly releases energy as heat and light — that is not the missing characteristic.',2:'It does change size, so this cannot be the failure.',3:'It uses wax as fuel, so material use is not the problem.'}}}
